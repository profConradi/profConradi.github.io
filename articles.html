<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles – Simone Conradi</title>
    <meta name="description" content="Scientific articles on mathematics, physics, and artificial intelligence by Simone Conradi">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- MathJax for equation rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-content">
            <a href="index.html" class="logo">Simone Conradi</a>
            <div class="nav-links">
                <a href="index.html#about">About</a>
                <a href="articles.html">Articles</a>
                <a href="index.html#math-art">Mathematical art</a>
                <a href="index.html#contact">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Articles Page -->
    <section class="articles-page">
        <div class="container">
            <div class="page-header">
                <h1>Articles</h1>
                <p class="page-intro">Explorations in mathematics, physics, and computational methods</p>
            </div>

            <div class="articles-grid" id="articles-grid">
                <!-- Article items loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Simone Conradi. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Configuration
        const config = {
            contentPath: 'content/'
        };

        // Format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', options);
        }

        // Create article card element
        function createArticleCard(item) {
            const article = document.createElement('article');
            article.className = 'article-card';

            const header = document.createElement('div');
            header.className = 'article-header';

            const date = document.createElement('time');
            date.className = 'article-date';
            date.textContent = formatDate(item.date);
            date.setAttribute('datetime', item.date);

            const tags = document.createElement('div');
            tags.className = 'article-tags';
            if (item.tags && item.tags.length > 0) {
                item.tags.forEach(tag => {
                    const tagSpan = document.createElement('span');
                    tagSpan.className = 'article-tag';
                    tagSpan.textContent = tag;
                    tags.appendChild(tagSpan);
                });
            }

            header.appendChild(date);
            if (item.readTime) {
                const readTime = document.createElement('span');
                readTime.className = 'article-read-time';
                readTime.textContent = ` · ${item.readTime}`;
                header.appendChild(readTime);
            }

            const title = document.createElement('h3');
            title.className = 'article-title';
            title.textContent = item.title;

            const summary = document.createElement('p');
            summary.className = 'article-summary';
            summary.textContent = item.summary;

            const link = document.createElement('a');
            link.href = `article.html?id=${item.slug}`;
            link.className = 'article-link';
            link.textContent = 'Read article →';

            article.appendChild(header);
            article.appendChild(tags);
            article.appendChild(title);
            article.appendChild(summary);
            article.appendChild(link);

            return article;
        }

        // Load articles
        async function loadArticles() {
            try {
                const response = await fetch(`${config.contentPath}articles.json`);
                if (!response.ok) return;

                const articles = await response.json();
                const articlesContainer = document.getElementById('articles-grid');

                articles.items.forEach(item => {
                    const articleCard = createArticleCard(item);
                    articlesContainer.appendChild(articleCard);
                });
            } catch (error) {
                console.error('Error loading articles:', error);
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>
</body>
</html>
