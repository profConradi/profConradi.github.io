<script>

"use strict";
let LANG=(()=>{try{const v=localStorage.getItem('llm-map-lang');if(v==='it'||v==='en')return v}catch(e){}return(navigator.language||'').toLowerCase().startsWith('it')?'it':'en'})();
document.documentElement.lang=LANG;
const LX=(en,it)=>LANG==='it'?it:en;
const HAND='"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive';
const HS=1.06;
const SERIF='"Newsreader",Georgia,serif';
const C={};
function isDark(){const t=document.documentElement.dataset.theme;if(t==='dark')return true;if(t==='light')return false;return matchMedia('(prefers-color-scheme: dark)').matches}
function readColors(){const cs=getComputedStyle(document.documentElement);for(const k of['paper','ink','muted','blue','red','yellow','green','line'])C[k]=cs.getPropertyValue('--'+k).trim();C.dark=isDark()}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(){let h=2166136261>>>0;for(let i=0;i<arguments.length;i++){h^=(Math.round(arguments[i])|0);h=Math.imul(h,16777619)}return h>>>0}
const P={ctx:null,budget:Infinity,used:0,dry:false,minw:0,scale:0,
  take(len){const u0=this.used;this.used+=len;if(this.dry)return 0;if(this.budget===Infinity)return 1;return Math.max(0,Math.min(1,(this.budget-u0)/len))}};
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function cut(p,f){if(f>=1)return p;const L=plen(p)*f;let acc=0;const o=[p[0]];for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(acc+d>=L){const r=d?(L-acc)/d:0;o.push([p[i-1][0]+(p[i][0]-p[i-1][0])*r,p[i-1][1]+(p[i][1]-p[i-1][1])*r]);return o}acc+=d;o.push(p[i])}return o}
function smooth(ctx,q){ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);if(q.length<3){for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1])}else{for(let i=1;i<q.length-1;i++){ctx.quadraticCurveTo(q[i][0],q[i][1],(q[i][0]+q[i+1][0])/2,(q[i][1]+q[i+1][1])/2)}ctx.lineTo(q[q.length-1][0],q[q.length-1][1])}ctx.stroke()}
function stroke(pts,o={}){if(pts.length<2)return;const L=plen(pts)||1;const f=P.take(L*(o.speed??1));if(f<=0)return;const ctx=P.ctx;
  const n=pts.length-1;const r=mulberry(hsh(pts[0][0]/3,pts[0][1]/3,pts[n][0]/3,pts[n][1]/3,n,o.seed||0));
  const passes=o.passes??2,j=o.jit??0.8,w=o.w??1.5,a=o.a??0.9;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=o.col||C.ink;if(o.dash)ctx.setLineDash(o.dash);
  for(let p=0;p<passes;p++){ctx.globalAlpha=a*(p?0.42:1);ctx.lineWidth=Math.max(P.minw,w*(p?0.7:1));const q=pts.map(t=>[t[0]+(r()-.5)*2*j,t[1]+(r()-.5)*2*j]);smooth(ctx,cut(q,f))}
  ctx.restore()}
function seg(x1,y1,x2,y2,o={}){const L=Math.hypot(x2-x1,y2-y1);if(L<0.5)return;const n=Math.max(2,Math.ceil(L/16));const r=mulberry(hsh(x1/3,y1/3,x2/3,y2/3,9));
  const bow=(r()-.5)*Math.min(L*0.03,6)*(o.bow??1);const nx=-(y2-y1)/L,ny=(x2-x1)/L;const pts=[];
  for(let i=0;i<=n;i++){const t=i/n,b=Math.sin(Math.PI*t)*bow;pts.push([x1+(x2-x1)*t+nx*b,y1+(y2-y1)*t+ny*b])}stroke(pts,o)}
function resample(pts,closed,step=14){const a=closed?[...pts,pts[0]]:pts;const out=[];for(let i=0;i<a.length-1;i++){const[x1,y1]=a[i],[x2,y2]=a[i+1];const L=Math.hypot(x2-x1,y2-y1);const n=Math.max(1,Math.ceil(L/step));for(let k=(i?1:0);k<=n;k++){const t=k/n;out.push([x1+(x2-x1)*t,y1+(y2-y1)*t])}}return out}
function path(pts,o={},closed=false){stroke(resample(pts,closed),o)}
function curve(pts,o={}){stroke(pts,o)}
function ellPoly(cx,cy,rx,ry,n=28){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function ell(cx,cy,rx,ry,o={}){if(o.solid)solid(ellPoly(cx,cy,rx,ry,36),o.solid);if(o.fill)wash(ellPoly(cx,cy,rx,ry),o.fill,o.fa??0.55);if(o.hatch)hatch(ellPoly(cx,cy,rx,ry),o.hatch);if(o.nostroke)return;
  const r=mulberry(hsh(cx/3,cy/3,rx*3,ry*3,3));const a0=r()*Math.PI*2,over=o.over??(0.3+r()*0.3);const n=Math.max(12,Math.ceil((rx+ry)*Math.PI/7));const wob=o.wob??0.035,ph=r()*6;const pts=[];
  for(let i=0;i<=n;i++){const a=a0+(Math.PI*2+over)*i/n;const k=1+Math.sin(a*2+ph)*wob*0.5+(i/n-0.5)*wob;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}stroke(pts,o)}
function box(x,y,w,h,o={}){const p=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];if(o.solid)solid(p,o.solid);if(o.fill)wash(p,o.fill,o.fa??0.5);if(o.hatch)hatch(p,o.hatch);if(!o.nostroke)path(p,o,true)}
function solid(poly,col){raw(10,ctx=>{ctx.fillStyle=col;ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()})}
function wash(poly,col,a=0.45){const f=P.take(25);if(f<=0)return;const ctx=P.ctx;const r=mulberry(hsh(poly[0][0]/3,poly[0][1]/3,poly.length,77));
  ctx.save();ctx.fillStyle=col;if(!C.dark)ctx.globalCompositeOperation='multiply';
  for(let k=0;k<3;k++){ctx.globalAlpha=a*f*(k?0.3:0.55);ctx.beginPath();poly.forEach((p,i)=>{const x=p[0]+(r()-.5)*3.5,y=p[1]+(r()-.5)*3.5;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill()}ctx.restore()}
function hatch(poly,o={}){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of poly){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+2,ang=(o.ang??-50)*Math.PI/180,gap=o.gap??6;if(P.scale&&gap*P.scale<1.3){if(P.dry)return;const c=P.ctx;c.save();c.fillStyle=o.col||C.ink;c.globalAlpha=(o.a??0.45)*0.22;c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();c.restore();return}const n=Math.floor(2*R/gap);if(n<1)return;
  const f=P.take(n*3);if(f<=0)return;const ctx=P.ctx;const r=mulberry(hsh(cx/3,cy/3,R,gap*10));const dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx;
  ctx.save();ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.clip();
  ctx.strokeStyle=o.col||C.ink;ctx.lineWidth=o.w??0.9;ctx.globalAlpha=o.a??0.45;ctx.lineCap='round';ctx.beginPath();const m=Math.ceil(n*f);
  for(let i=0;i<m;i++){const d=-R+i*gap+(r()-.5)*gap*0.5;const px=cx+nx*d,py=cy+ny*d;const e=R*(0.92+r()*0.08);ctx.moveTo(px-dx*e+(r()-.5)*2,py-dy*e+(r()-.5)*2);ctx.lineTo(px+dx*e+(r()-.5)*2,py+dy*e+(r()-.5)*2)}

function treeCypress(x,y,s,col){const p=[[x-10*s,y],[x-14*s,y-60*s],[x,y-120*s],[x+14*s,y-60*s],[x+10*s,y]];wash(p,col,.5);hatch(p,{gap:5,a:.2,ang:80});path(p,{w:1.4},true)}
function bush(x,y,s,col){ell(x,y-14*s,26*s,16*s,{fill:col,fa:.5,w:1.3})}
function pine(x,y,s,col){seg(x,y,x+8*s,y-60*s,{w:2});for(const[dx,dy,r]of[[-18,-58,24],[24,-70,20],[4,-88,18]])ell(x+dx*s,y+dy*s,r*s,9*s,{fill:col,fa:.6,w:1.2})}
function plantTree(x,y,t,r){const reg=regionOf(t);const s=0.8+r()*0.5;
 switch(reg){
  case'meadow':return r()<.7?treeRound(x,y,s,r()<.3?RC('gold'):RC('summer1')):bush(x,y,s,RC('summer1'));
  case'workshop':return r()<.5?treeRound(x,y,s,RC('engine')):bush(x,y,s,RC('summer1'));
  case'hills':return r()<.7?treeRound(x,y,s,RC('summer2')):treeRound(x,y,s,RC('gold'));
  case'village':return r()<.6?treeCypress(x,y,s,RC('logic')):bush(x,y,s,RC('city'));
  case'garden':return r()<.6?bush(x,y,s*1.2,RC('protein')):treeRound(x,y,s,RC('bridge'));
  case'maze':return treeCone(x,y,s*1.1,RC('woods'),false);
  case'marsh':return r()<.5?treeBare(x,y,s):bush(x,y,s,RC('winter'));
  case'lookout':return r()<.5?pine(x,y,s,RC('woods')):bush(x,y,s,RC('go'));
 }}

const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];// E S W N
function makeMaze(seed){const r=mulberry(seed);const N=5;const open=Array.from({length:N*N},()=>[false,false,false,false]);const seen=new Set([0]);const stack=[0];
  while(stack.length){const c=stack[stack.length-1];const x=c%N,y=Math.floor(c/N);const nb=[];DIRS.forEach(([dx,dy],d)=>{const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen.has(ny*N+nx))nb.push([d,ny*N+nx])});
   if(!nb.length){stack.pop();continue}const[d,n]=nb[Math.floor(r()*nb.length)];open[c][d]=true;open[n][(d+2)%4]=true;seen.add(n);stack.push(n)}
  for(let k=0;k<3;k++){const c=Math.floor(r()*N*N);const d=Math.floor(r()*2);const x=c%N,y=Math.floor(c/N);const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<N&&ny<N){open[c][d]=true;open[ny*N+nx][(d+2)%4]=true}}
  return open}

function gauss(r){let u=0,v=0;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function stats(pts){const n=pts.length;const m=[0,0];pts.forEach(p=>{m[0]+=p[0]/n;m[1]+=p[1]/n});let a=0,b=0,c=0;pts.forEach(p=>{const dx=p[0]-m[0],dy=p[1]-m[1];a+=dx*dx/n;b+=dx*dy/n;c+=dy*dy/n});return{m,S:[[a,b],[b,c]]}}
function chol(S){const l11=Math.sqrt(S[0][0]),l21=S[1][0]/l11,l22=Math.sqrt(S[1][1]-l21*l21);return[[l11,0],[l21,l22]]}
const GR={x0:60,x1:610,y0:30,y1:440};
SC.gen={init(st){const r=mulberry(5);st.cls=[[],[]];const M=[[205,320],[465,150]];const L=[[[62,0],[26,34]],[[58,0],[-22,38]]];
  for(let k=0;k<2;k++){let n=0;while(n<30){const z1=gauss(r),z2=gauss(r);const p=[M[k][0]+L[k][0][0]*z1,M[k][1]+L[k][1][0]*z1+L[k][1][1]*z2];if(p[0]<GR.x0+10||p[0]>GR.x1-10||p[1]<GR.y0+10||p[1]>GR.y1-10)continue;st.cls[k].push(p);n++}}
  st.st=st.cls.map(stats);const Sp=[[0,0],[0,0]];for(let i=0;i<2;i++)for(let j=0;j<2;j++)Sp[i][j]=(st.st[0].S[i][j]+st.st[1].S[i][j])/2;
  const det=Sp[0][0]*Sp[1][1]-Sp[0][1]*Sp[1][0];const inv=[[Sp[1][1]/det,-Sp[0][1]/det],[-Sp[1][0]/det,Sp[0][0]/det]];const dm=[st.st[1].m[0]-st.st[0].m[0],st.st[1].m[1]-st.st[0].m[1]];
  st.w=[inv[0][0]*dm[0]+inv[0][1]*dm[1],inv[1][0]*dm[0]+inv[1][1]*dm[1]];const mid=[(st.st[0].m[0]+st.st[1].m[0])/2,(st.st[0].m[1]+st.st[1].m[1])/2];st.c=st.w[0]*mid[0]+st.w[1]*mid[1];
  st.mode='disc';st.q=[];st.news=[[],[]];st.rng=mulberry(99)},
 f(st,p){return st.w[0]*p[0]+st.w[1]*p[1]-st.c},

   for(let k=0;k<2;k++){const L=chol(st.st[k].S);let n=0;while(n<4){const z1=gauss(st.rng),z2=gauss(st.rng);const p=[st.st[k].m[0]+L[0][0]*z1,st.st[k].m[1]+L[1][0]*z1+L[1][1]*z2];if(p[0]<GR.x0+8||p[0]>GR.x1-8||p[1]<GR.y0+8||p[1]>GR.y1-8)continue;st.news[k].push(p);n++}if(st.news[k].length>16)st.news[k].splice(0,4)}}
  if(a==='clear'){st.q=[];st.news=[[],[]]}},

 draw(st){const{x0,x1,y0,y1}=GR;const rect=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];const col=[C.blue,C.red];
  if(st.mode==='disc'){const A=clipHalf(rect,p=>-this.f(st,p)),B=clipHalf(rect,p=>this.f(st,p));if(A.length>2)wash(A,C.blue,.13);if(B.length>2)wash(B,C.red,.13);
   // retta di confine: intersezioni con il rettangolo
   const pts=[];for(let i=0;i<4;i++){const a=rect[i],b=rect[(i+1)%4];const fa=this.f(st,a),fb=this.f(st,b);if((fa>=0)!==(fb>=0)){const t=fa/(fa-fb);pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}

const CONTENT={"en": {"1": {"year": "the big picture", "h2": "A map of the territory", "ps": ["Nested shapes mean “is a kind of”: every LLM is a generative model, and almost every generative model in use today is a deep neural network, which is one way of doing machine learning.", "Arrows mean other relations: an assistant is built around an LLM, an agent puts an LLM in a loop with tools, you talk to both through prompts, and all of them can hallucinate.", "Tap a node to read a short definition and the source it is based on. The button takes you to the stop that explains it."], "ctrl": "<div class=\"defbox\" aria-live=\"polite\"><div class=\"dt\"></div><div class=\"ds\"></div></div><button class=\"h\" data-act=\"go\">go</button>", "line": "Every maze is easier with a map. I learned mine square by square; you can learn this one node by node."}, "2": {"year": "definition", "h2": "Telling apart or making new", "ps": ["Most machine learning models are discriminative: given an input, they assign a label or a value — spam or not spam, cat or dog, the price of a house. What they learn is where the boundary between the classes lies.", "Generative models learn how the data themselves are distributed, so they can draw new examples that resemble the training data. Generative AI uses such models, today almost always deep neural networks, to produce text, images, audio, video and code.", "Generating does not exclude predicting: an LLM writes precisely by predicting the next token and drawing from those predictions."], "ctrl": "<button class=\"h\" data-act=\"mode\" data-v=\"disc\" aria-pressed=\"true\">discriminative</button><button class=\"h\" data-act=\"mode\" data-v=\"gen\" aria-pressed=\"false\">generative</button><button class=\"h\" data-act=\"sample\">draw new examples</button><button class=\"h\" data-act=\"clear\">clear</button>", "line": "Fun fact: back in 1948 my inventor was already generating fake English, using the statistics of letters and words. Generative models are older than they look.", "hint": "discriminative: tap the plane to classify a point · generative: draw new ones"}, "3": {"year": "definition", "h2": "Predicting the next token", "ps": ["A large language model is an artificial neural network with a very large number of parameters, trained on huge amounts of text to estimate the probability of the next token given the tokens that precede it.", "It does not output one word: it outputs a probability for every token in its vocabulary, which in Llama 3 contains about 128,000 tokens. A program picks one, appends it to the text and asks again. Generation is prediction, repeated.", "“Large” has no sharp threshold: it refers to the number of parameters, today usually billions, and to the amount of training text."], "ctrl": "<button class=\"h\" data-act=\"sample\">let chance pick</button><button class=\"h\" data-act=\"restart\">start again</button>", "line": "Next token, next token, next token… A bit like me in the maze: one square at a time, never seeing the whole path at once.", "hint": "tap a bar to append that token · probabilities are illustrative"}, "4": {"year": "under the hood", "h2": "Text becomes tokens", "ps": ["A model reads neither letters nor whole words. A tokenizer first cuts the text into tokens: frequent words become one token, rarer ones are split into pieces. In English a token is about ¾ of a word on average; other languages often need more tokens for the same text.", "Many tokenizers are built with byte-pair encoding (BPE): start from single characters and repeatedly merge the pair of symbols that occurs most often in a training corpus. Each merge adds a token to the vocabulary.", "On the sheet BPE runs on a corpus of nine words. Real tokenizers often work on bytes, learn from billions of words and stop after tens of thousands of merges or more."], "ctrl": "<button class=\"h\" data-act=\"merge\">merge the most frequent pair</button><button class=\"h\" data-act=\"reset\">reset</button>", "line": "My maze had 25 squares. Llama 3’s vocabulary has about 128,000 tokens. My relays get dizzy just thinking about it.", "hint": "watch how “reopened”, a word not in the corpus, gets split"}, "5": {"year": "under the hood", "h2": "Learning to predict from text", "ps": ["Pre-training needs no labels written by people: the text provides its own answers. The model reads a passage, predicts the next token, compares the prediction with the token that actually follows and adjusts its parameters, by gradient descent, to make that token more probable. This is repeated over trillions of tokens.", "The toy on the sheet is far simpler: it only counts which word follows which. For such a model, counting gives exactly the probabilities that best predict the training text.", "Shannon generated text this way in 1948, word pair by word pair. An LLM looks back at thousands of tokens, not at one word."], "ctrl": "<button class=\"h\" data-act=\"read\">read one sentence</button><button class=\"h\" data-act=\"all\">read all</button><button class=\"h\" data-act=\"gen\">write a sentence</button><button class=\"h\" data-act=\"reset\">start over</button>", "line": "In 1948 Shannon did this by hand: he opened a book at random, read on until he met the last word written, and copied the word after it. His idea, animated.", "hint": "tap a word in the middle row to see what tends to follow it"}, "6": {"year": "under the hood", "h2": "Picking a token: temperature", "ps": ["The network outputs a score for every token, and the softmax function turns the scores into probabilities. Then the program must choose. Always taking the most probable token is called greedy decoding; drawing at random according to the probabilities is called sampling.", "The temperature T divides the scores before the softmax. Below 1 the favourite becomes even more likely and answers are more predictable; above 1 the distribution flattens and unlikely tokens are chosen more often, for better or worse.", "This is one reason why the same prompt can give different answers. The scores here are illustrative."], "ctrl": "<label class=\"rng\">T <input type=\"range\" min=\"1\" max=\"20\" value=\"10\" data-act=\"T\"></label><button class=\"h\" data-act=\"greedy\">greedy</button><button class=\"h\" data-act=\"draw\">sample 20 times</button><button class=\"h\" data-act=\"clear\">clear</button>", "line": "At low temperature you get the favourite every time; at high temperature, surprises, some good, some nonsense. Personally, I like my cheese predictable.", "hint": "move the temperature and watch the bars"}, "7": {"year": "numbers", "h2": "How large is large?", "ps": ["Parameters are the numbers adjusted during training. GPT-1 (2018) had about 117 million, GPT-2 (2019) 1.5 billion, GPT-3 (2020) 175 billion, trained on 300 billion tokens.", "In 2022 DeepMind’s Chinchilla, with 70 billion parameters but 1.4 trillion training tokens, outperformed larger models: data count as much as size. Llama 3.1 405B (2024) was trained on about 15.6 trillion tokens. Many companies no longer disclose these figures.", "Reading 15.6 trillion tokens at 250 words a minute, eight hours a day, would take a person roughly 270,000 years (taking ¾ of a word per token)."], "ctrl": "<button class=\"h\" data-act=\"k\" data-v=\"p\" aria-pressed=\"true\">parameters</button><button class=\"h\" data-act=\"k\" data-v=\"t\" aria-pressed=\"false\">training tokens</button>", "line": "My whole memory: one stored direction for each of my 25 squares. Llama 3.1: 405 billion parameters. I’m not jealous. Much.", "hint": "logarithmic scale: each step up is ten times more · tap a bar"}, "8": {"year": "definition", "h2": "From language model to assistant", "ps": ["A model after pre-training only continues text: given a request, it may well continue with more requests. To become an assistant it is trained further on example dialogues, then on human preferences between answers (RLHF, reinforcement learning from human feedback, or similar methods).", "In 2022 OpenAI showed that people preferred the answers of a 1.3-billion-parameter model trained this way to those of the 175-billion GPT-3. ChatGPT, released that November, used the same approach.", "An AI assistant is the whole application built around the model, on a website or in an app: it adds instructions, the conversation history, safety filters and often tools, and converses in natural language to answer, write, revise, analyse data and code."], "ctrl": "<button class=\"h\" data-act=\"k\" data-v=\"base\" aria-pressed=\"true\">base model</button><button class=\"h\" data-act=\"k\" data-v=\"chat\" aria-pressed=\"false\">assistant</button>", "line": "ChatGPT came out in November 2022, seventy-two years after me. It talks much more than I do.", "hint": "tap a stage · outputs written by us to show typical behaviour"}, "9": {"year": "in practice", "h2": "What the model actually reads", "ps": ["The model itself remembers nothing from one message to the next. Each time you write, the application sends it one long text: its system instructions, the whole conversation so far, any attached files and tool results.", "The maximum number of tokens the model can read at once is its context window: 128,000 for Llama 3.1, for example. When a conversation grows beyond it, older parts must be dropped or summarised. “Memory” features usually work the same way: the app inserts saved notes into the text.", "Here the window holds only 60 tokens, and the token counts are illustrative."], "ctrl": "<button class=\"h\" data-act=\"next\">send the next message</button><button class=\"h\" data-act=\"sum\" aria-pressed=\"false\">summarise what falls out</button><button class=\"h\" data-act=\"reset\">reset</button>", "line": "Between one run and the next, my memory stayed in the relays under the floor. An LLM keeps nothing: the app must hand it the conversation every time.", "hint": "you still see the whole chat; the model does not"}, "10": {"year": "in practice", "h2": "Writing a good prompt", "ps": ["A prompt is the input you give the model: a question, an instruction, a text to work on, possibly with images or files. The quality of the answer depends to a large extent on it, though also on the model and, because of sampling, on chance.", "The guides published by model developers agree on a few habits: give context (who it is for, and why), be specific about the task, state the format you want, show an example, and allow the model to say it does not know.", "Add the pieces one at a time with the buttons below. The answers were written by us to show the typical effect; real answers vary."], "ctrl": "<button class=\"h\" data-act=\"add\">add the next piece</button><button class=\"h\" data-act=\"reset\">back to the vague prompt</button>", "line": "Shannon never told me where the goal was: I had to find it. With a model it pays to say exactly what you want.", "hint": "new text in the prompt is written in blue"}, "11": {"year": "definition", "h2": "Beyond text: multimodal models", "ps": ["A multimodal LLM accepts other kinds of data besides text, such as images, audio and video, and in some cases produces them too. Input and output can differ: GPT-4 (2023) accepted images and text but produced only text.", "To be processed like words, an image is cut into square patches and each patch becomes a vector, much like a token. The 2020 paper that made this approach popular was titled “An image is worth 16x16 words”. Audio is similarly cut into short frames.", "Change the patch size: smaller patches keep more detail but produce many more tokens to process."], "ctrl": "<label class=\"rng\">patch size <input type=\"range\" min=\"0\" max=\"3\" value=\"1\" data-act=\"p\"></label>", "line": "My whiskers could feel only one thing: is there a wall or not? Multimodal models read words, pictures and sounds.", "hint": "point at a patch · the numbers in the vector are illustrative"}, "12": {"year": "a long-standing idea", "h2": "What is an agent?", "ps": ["In AI the word agent has been in use for decades. In their textbook, Russell and Norvig define it as anything that perceives its environment through sensors and acts on it through actuators. A rational agent chooses the actions expected to do best at its task.", "Theseus fits: copper whiskers feel the walls, an electromagnet moved by motors under the floor drags him, and telephone relays store, for each square, the direction in which he last left it. On the first run he explores; on the second he follows his memory.", "Our rule is a simplified version of Shannon’s: in each square, try the next direction clockwise from the stored one."], "ctrl": "<button class=\"h\" data-act=\"explore\">first run: explore</button><button class=\"h\" data-act=\"recall\">second run: remember</button><button class=\"h\" data-act=\"walls\">move the walls</button><label class=\"rng\">speed <input type=\"range\" min=\"1\" max=\"10\" value=\"5\" data-act=\"speed\"></label>", "line": "That’s me! Whiskers for sensors, a magnet and motors for actuators, relays for memory. In 1952 a Bell Labs film showed me learning a maze.", "hint": "red ticks: the whiskers touching a wall", "people": [["Claude Shannon", "shannon"], ["Stuart Russell", "russell"], ["Peter Norvig", "norvig"]]}, "13": {"year": "definition", "h2": "LLM agents: a loop with tools", "ps": ["Today an agent usually means an LLM inside a program that works in a digital environment. The model reads the task and everything that has happened so far, and writes text. If the text is a call to an available tool (search the web, read a file, run code, send a message) the program really performs it and adds the result.", "The loop of observing, choosing and acting repeats a number of times not fixed in advance: until the model writes a final answer instead of a tool call, or a step limit is reached. The model decides it has finished, and it can be wrong.", "Uses range from programming and customer service to office workflows and security monitoring."], "ctrl": "<button class=\"h\" data-act=\"step\">next step</button><button class=\"h\" data-act=\"reset\">reset</button><label class=\"rng\">max model calls <input type=\"range\" min=\"1\" max=\"4\" value=\"4\" data-act=\"lim\"></label>", "line": "My loop was: touch, turn, move, remember. Theirs is: read, call a tool, read the result. Same idea, a much bigger maze.", "hint": "a scripted run, not a live model · the search result quotes a real article"}, "14": {"year": "handle with care", "h2": "Plausible is not true", "ps": ["An LLM hallucinates when it produces content that sounds plausible but is false, or not supported by the sources it was given, stated with the same confidence as correct content. The model generates probable text, not verified facts.", "A 2025 study argues that training and common benchmarks reward guessing over admitting uncertainty, like a test with no penalty for wrong answers. NIST calls the phenomenon confabulation.", "So never trust facts, dates, names, numbers, quotations or references blindly: check them against primary sources and open the links you are given. The answer on the sheet was written by us to imitate a hallucination."], "ctrl": "<button class=\"h\" data-act=\"reveal\">check against sources</button><button class=\"h\" data-act=\"reset\">reset</button>", "line": "I am real, promise: you can watch me in Shannon’s 1952 film. See? A claim you can check. Do the same with every answer you get.", "hint": "tap the claims you would not trust without checking"}, "15": {"year": "review", "h2": "Find your way out", "ps": ["Eight questions to review the walk. Tap an option: the score sheet on the map keeps count.", "For the class: play in teams, one question per team, and always explain your answer before tapping it."], "ctrl": "<div class=\"quiz\"><div class=\"q\"></div><div class=\"opts\"></div><div class=\"why\" aria-live=\"polite\"></div><div class=\"ctrl\"><button class=\"h\" data-act=\"next\">next question</button><button class=\"h\" data-act=\"restart\">start again</button></div></div>", "line": "Last maze! If you are unsure of an answer, say so: it is exactly what we would like LLMs to do."}, "intro": {"year": "a map for the fifth year", "h1": "Large language models", "sub": "The main ideas, drawn in pencil.", "ps": ["This map is a walk through the main ideas behind large language models: what they are, how they are trained, how they become assistants and agents, and why they can be confidently wrong. Each stop has a small experiment to play with.", "Walk the trail with the mouse wheel, the arrow keys, a swipe or the buttons below. “Whole map” shows everything at once. The shape of the land is decorative: hills and valleys do not measure anything.", "Your guide is Theseus, the mechanical mouse Claude Shannon built in 1950 to learn mazes. The few people drawn are stylised sketches, not portraits. Numbers marked as illustrative were chosen by hand to explain an idea."], "ctrl": "<button class=\"h\" data-nav=\"next\">start the walk</button>", "line": "Hi! I’m Theseus, the mechanical mouse Claude Shannon built in 1950. I learned mazes with telephone relays. Today the maze is made of ideas: follow me!"}}, "it": {"1": {"year": "il quadro d’insieme", "h2": "Una mappa del territorio", "ps": ["Le forme una dentro l’altra significano «è un tipo di»: ogni LLM è un modello generativo, e quasi ogni modello generativo usato oggi è una rete neurale profonda, cioè un modo di fare machine learning.", "Le frecce indicano altre relazioni: un assistente è costruito attorno a un LLM, un agente mette un LLM in un ciclo con degli strumenti, con entrambi si comunica attraverso i prompt, e tutti possono allucinare.", "Tocca un nodo per leggerne una breve definizione e la fonte su cui si basa. Il bottone porta alla tappa che lo spiega."], "ctrl": "<div class=\"defbox\" aria-live=\"polite\"><div class=\"dt\"></div><div class=\"ds\"></div></div><button class=\"h\" data-act=\"go\">go</button>", "line": "Ogni labirinto è più facile con una mappa. Io ho imparato il mio casella per casella; voi potete imparare questo nodo per nodo."}, "2": {"year": "definizione", "h2": "Distinguere o creare", "ps": ["La maggior parte dei modelli di machine learning è discriminativa: dato un input, assegna un’etichetta o un valore, come spam o non spam, gatto o cane, il prezzo di una casa. Ciò che impara è dove passa il confine tra le classi.", "I modelli generativi imparano come sono distribuiti i dati stessi, e quindi possono estrarre esempi nuovi simili a quelli di addestramento. L’IA generativa usa modelli di questo tipo, oggi quasi sempre reti neurali profonde, per produrre testo, immagini, audio, video e codice.", "Generare non esclude prevedere: un LLM scrive proprio prevedendo il token successivo ed estraendo da quelle previsioni."], "ctrl": "<button class=\"h\" data-act=\"mode\" data-v=\"disc\" aria-pressed=\"true\">discriminativo</button><button class=\"h\" data-act=\"mode\" data-v=\"gen\" aria-pressed=\"false\">generativo</button><button class=\"h\" data-act=\"sample\">genera nuovi esempi</button><button class=\"h\" data-act=\"clear\">cancella</button>", "line": "Curiosità: già nel 1948 il mio inventore generava finto inglese usando le statistiche di lettere e parole. I modelli generativi sono più vecchi di quanto sembri.", "hint": "discriminativo: tocca il piano per classificare un punto · generativo: generane di nuovi"}, "3": {"year": "definizione", "h2": "Prevedere il token successivo", "ps": ["Un large language model è una rete neurale artificiale con un numero molto grande di parametri, addestrata su enormi quantità di testo a stimare la probabilità del token successivo a partire dai token che lo precedono.", "Non restituisce una parola: restituisce una probabilità per ogni token del suo vocabolario, che in Llama 3 ne contiene circa 128.000. Un programma ne sceglie uno, lo aggiunge al testo e chiede di nuovo. Generare è prevedere, più volte.", "«Large» non ha una soglia netta: si riferisce al numero di parametri, oggi di solito miliardi, e alla quantità di testo di addestramento."], "ctrl": "<button class=\"h\" data-act=\"sample\">lascia scegliere al caso</button><button class=\"h\" data-act=\"restart\">ricomincia</button>", "line": "Token dopo token dopo token… Un po’ come me nel labirinto: una casella alla volta, senza mai vedere tutto il percorso.", "hint": "tocca una barra per aggiungere quel token · probabilità illustrative"}, "4": {"year": "dietro le quinte", "h2": "Il testo diventa token", "ps": ["Un modello non legge né lettere né parole intere. Prima un tokenizer taglia il testo in token: le parole frequenti diventano un solo token, quelle più rare vengono spezzate. In inglese un token vale in media circa ¾ di parola; altre lingue, come l’italiano, spesso richiedono più token per lo stesso testo.", "Molti tokenizer si costruiscono con il byte-pair encoding (BPE): si parte dai singoli caratteri e si unisce ripetutamente la coppia di simboli più frequente in un corpus di addestramento. Ogni unione aggiunge un token al vocabolario.", "Sul foglio il BPE lavora su un corpus di nove parole. I tokenizer veri spesso lavorano sui byte, imparano da miliardi di parole e si fermano dopo decine di migliaia di unioni o più."], "ctrl": "<button class=\"h\" data-act=\"merge\">unisci la coppia più frequente</button><button class=\"h\" data-act=\"reset\">ricomincia</button>", "line": "Il mio labirinto aveva 25 caselle. Il vocabolario di Llama 3 ha circa 128.000 token. Ai miei relè gira la testa solo a pensarci.", "hint": "guarda come viene divisa «gattini», parola che non è nel corpus"}, "5": {"year": "dietro le quinte", "h2": "Imparare a prevedere dal testo", "ps": ["Il pre-addestramento non richiede etichette scritte da persone: è il testo stesso a fornire le risposte. Il modello legge un brano, prevede il token successivo, lo confronta con quello che segue davvero e, con la discesa del gradiente, corregge i parametri per rendere quel token più probabile. Si ripete su migliaia di miliardi di token.", "Il giocattolo sul foglio è molto più semplice: conta soltanto quale parola segue quale. Per un modello del genere, contare dà esattamente le probabilità che prevedono meglio il testo di addestramento.", "Shannon generò testo così nel 1948, una coppia di parole alla volta. Un LLM guarda indietro migliaia di token, non una sola parola."], "ctrl": "<button class=\"h\" data-act=\"read\">leggi una frase</button><button class=\"h\" data-act=\"all\">leggi tutto</button><button class=\"h\" data-act=\"gen\">scrivi una frase</button><button class=\"h\" data-act=\"reset\">ricomincia</button>", "line": "Nel 1948 Shannon lo faceva a mano: apriva un libro a caso, leggeva finché incontrava l’ultima parola scritta e copiava quella dopo. La sua idea, animata.", "hint": "tocca una parola nella fila centrale per vedere che cosa tende a seguirla"}, "6": {"year": "dietro le quinte", "h2": "Scegliere un token: la temperatura", "ps": ["La rete restituisce un punteggio per ogni token, e la funzione softmax trasforma i punteggi in probabilità. Poi il programma deve scegliere. Prendere sempre il token più probabile si chiama decodifica greedy («avida»); estrarre a caso secondo le probabilità si chiama campionamento.", "La temperatura T divide i punteggi prima della softmax. Sotto 1 il favorito diventa ancora più probabile e le risposte sono più prevedibili; sopra 1 la distribuzione si appiattisce e i token improbabili vengono scelti più spesso, nel bene e nel male.", "È uno dei motivi per cui lo stesso prompt può dare risposte diverse. I punteggi qui sono illustrativi."], "ctrl": "<label class=\"rng\">T <input type=\"range\" min=\"1\" max=\"20\" value=\"10\" data-act=\"T\"></label><button class=\"h\" data-act=\"greedy\">greedy</button><button class=\"h\" data-act=\"draw\">estrai 20 volte</button><button class=\"h\" data-act=\"clear\">cancella</button>", "line": "A temperatura bassa esce sempre il favorito; a temperatura alta, sorprese, alcune buone, altre senza senso. Io, personalmente, il formaggio lo preferisco prevedibile.", "hint": "sposta la temperatura e guarda le barre"}, "7": {"year": "numeri", "h2": "Quanto è grande «large»?", "ps": ["I parametri sono i numeri regolati durante l’addestramento. GPT-1 (2018) ne aveva circa 117 milioni, GPT-2 (2019) 1,5 miliardi, GPT-3 (2020) 175 miliardi, addestrato su 300 miliardi di token.", "Nel 2022 Chinchilla di DeepMind, con 70 miliardi di parametri ma 1.400 miliardi di token di addestramento, superò modelli più grandi: i dati contano quanto la dimensione. Llama 3.1 405B (2024) è stato addestrato su circa 15.600 miliardi di token. Molte aziende non dichiarano più questi numeri.", "Leggere 15.600 miliardi di token a 250 parole al minuto, otto ore al giorno, richiederebbe a una persona circa 270.000 anni (contando ¾ di parola per token)."], "ctrl": "<button class=\"h\" data-act=\"k\" data-v=\"p\" aria-pressed=\"true\">parametri</button><button class=\"h\" data-act=\"k\" data-v=\"t\" aria-pressed=\"false\">token di addestramento</button>", "line": "Tutta la mia memoria: una direzione per ciascuna delle mie 25 caselle. Llama 3.1: 405 miliardi di parametri. Non sono geloso. Non troppo.", "hint": "scala logaritmica: ogni gradino vale dieci volte il precedente · tocca una barra"}, "8": {"year": "definizione", "h2": "Dal modello linguistico all’assistente", "ps": ["Dopo il pre-addestramento un modello sa solo continuare il testo: davanti a una richiesta può benissimo proseguire con altre richieste. Per diventare un assistente viene addestrato ancora su dialoghi di esempio, poi sulle preferenze umane tra risposte (RLHF, apprendimento per rinforzo dal feedback umano, o metodi simili).", "Nel 2022 OpenAI mostrò che le persone preferivano le risposte di un modello da 1,3 miliardi di parametri addestrato così a quelle di GPT-3, da 175 miliardi. ChatGPT, uscito a novembre di quell’anno, usava lo stesso approccio.", "Un assistente IA è l’intera applicazione costruita attorno al modello, su un sito o in un’app: aggiunge istruzioni, cronologia, filtri di sicurezza e spesso strumenti, e dialoga in linguaggio naturale per rispondere, scrivere, revisionare, analizzare dati e programmare."], "ctrl": "<button class=\"h\" data-act=\"k\" data-v=\"base\" aria-pressed=\"true\">modello base</button><button class=\"h\" data-act=\"k\" data-v=\"chat\" aria-pressed=\"false\">assistente</button>", "line": "ChatGPT è uscito nel novembre 2022, settantadue anni dopo di me. Parla molto più di me.", "hint": "tocca una fase · output scritti da noi per mostrare il comportamento tipico"}, "9": {"year": "in pratica", "h2": "Che cosa legge davvero il modello", "ps": ["Il modello in sé non ricorda nulla da un messaggio all’altro. Ogni volta che scrivi, l’applicazione gli invia un unico lungo testo: le sue istruzioni di sistema, tutta la conversazione fin qui, eventuali file allegati e risultati degli strumenti.", "Il numero massimo di token che il modello può leggere in una volta è la sua finestra di contesto: 128.000 per Llama 3.1, per esempio. Quando la conversazione la supera, le parti più vecchie vanno tolte o riassunte. Anche le funzioni di «memoria» di solito funzionano così: l’app inserisce nel testo appunti salvati.", "Qui la finestra contiene solo 60 token, e i conteggi sono illustrativi."], "ctrl": "<button class=\"h\" data-act=\"next\">invia il messaggio successivo</button><button class=\"h\" data-act=\"sum\" aria-pressed=\"false\">riassumi ciò che esce</button><button class=\"h\" data-act=\"reset\">ricomincia</button>", "line": "Tra una corsa e l’altra la mia memoria restava nei relè sotto il pavimento. Un LLM non conserva nulla: l’app deve ridargli la conversazione ogni volta.", "hint": "tu vedi ancora tutta la chat; il modello no"}, "10": {"year": "in pratica", "h2": "Scrivere un buon prompt", "ps": ["Un prompt è l’input che si dà al modello: una domanda, un’istruzione, un testo da elaborare, eventualmente con immagini o file. La qualità della risposta dipende in larga misura dal prompt, ma anche dal modello e, a causa del campionamento, dal caso.", "Le guide pubblicate da chi sviluppa i modelli concordano su alcune abitudini: dare contesto (a chi serve e perché), essere precisi sul compito, indicare il formato, mostrare un esempio, permettere al modello di dire che non sa.", "Aggiungi i pezzi uno alla volta con i bottoni qui sotto. Le risposte sono state scritte da noi per mostrare l’effetto tipico; quelle reali variano."], "ctrl": "<button class=\"h\" data-act=\"add\">aggiungi il pezzo successivo</button><button class=\"h\" data-act=\"reset\">torna al prompt vago</button>", "line": "Shannon non mi diceva dove fosse la meta: dovevo trovarla io. Con un modello conviene dire esattamente che cosa si vuole.", "hint": "il testo nuovo nel prompt è scritto in blu"}, "11": {"year": "definizione", "h2": "Oltre il testo: i modelli multimodali", "ps": ["Un LLM multimodale accetta, oltre al testo, altri tipi di dati come immagini, audio e video, e in alcuni casi li produce anche. Ingresso e uscita possono differire: GPT-4 (2023) accettava immagini e testo ma produceva solo testo.", "Per essere elaborata come le parole, un’immagine viene tagliata in quadratini (patch) e ogni patch diventa un vettore, un po’ come un token. L’articolo del 2020 che ha reso popolare questo approccio si intitolava «An image is worth 16x16 words». Anche l’audio viene tagliato in brevi frammenti.", "Cambia la dimensione delle patch: patch più piccole conservano più dettagli ma producono molti più token da elaborare."], "ctrl": "<label class=\"rng\">dimensione patch <input type=\"range\" min=\"0\" max=\"3\" value=\"1\" data-act=\"p\"></label>", "line": "I miei baffi sentivano una cosa sola: c’è un muro o no? I modelli multimodali leggono parole, immagini e suoni.", "hint": "punta una patch · i numeri del vettore sono illustrativi"}, "12": {"year": "un’idea di lunga data", "h2": "Che cos’è un agente?", "ps": ["Nell’IA la parola agente è in uso da decenni. Nel loro manuale Russell e Norvig lo definiscono come qualunque cosa percepisca il proprio ambiente tramite sensori e agisca su di esso tramite attuatori. Un agente razionale sceglie le azioni che si aspetta funzionino meglio per il suo compito.", "Teseo rientra nella definizione: i baffi di rame sentono i muri, un elettromagnete mosso da motori sotto il pavimento lo trascina, e dei relè telefonici memorizzano, per ogni casella, la direzione in cui l’ha lasciata l’ultima volta. Alla prima corsa esplora; alla seconda segue la memoria.", "La nostra regola semplifica quella di Shannon: in ogni casella prova la direzione successiva, in senso orario, a quella memorizzata."], "ctrl": "<button class=\"h\" data-act=\"explore\">prima corsa: esplora</button><button class=\"h\" data-act=\"recall\">seconda corsa: ricorda</button><button class=\"h\" data-act=\"walls\">sposta i muri</button><label class=\"rng\">velocità <input type=\"range\" min=\"1\" max=\"10\" value=\"5\" data-act=\"speed\"></label>", "line": "Eccomi! Baffi per sensori, magnete e motori per attuatori, relè per memoria. Nel 1952 un filmato dei Bell Labs mi mostrò mentre imparavo un labirinto.", "hint": "tacche rosse: i baffi che toccano un muro", "people": [["Claude Shannon", "shannon"], ["Stuart Russell", "russell"], ["Peter Norvig", "norvig"]]}, "13": {"year": "definizione", "h2": "Agenti LLM: un ciclo con strumenti", "ps": ["Oggi per agente si intende di norma un LLM inserito in un programma che opera in un ambiente digitale. Il modello legge il compito e tutto ciò che è successo finora, e scrive un testo. Se il testo è la chiamata a uno strumento disponibile (cercare in rete, leggere un file, eseguire codice, inviare un messaggio), il programma la esegue davvero e aggiunge il risultato.", "Il ciclo di osservazione, scelta e azione si ripete un numero di volte non fissato in anticipo: finché il modello scrive una risposta finale invece di chiamare uno strumento, oppure si raggiunge un limite di passi. È il modello a decidere di aver finito, e può sbagliarsi.", "Le applicazioni vanno dalla programmazione all’assistenza clienti, dai flussi amministrativi alla sicurezza informatica."], "ctrl": "<button class=\"h\" data-act=\"step\">passo successivo</button><button class=\"h\" data-act=\"reset\">ricomincia</button><label class=\"rng\">massimo chiamate <input type=\"range\" min=\"1\" max=\"4\" value=\"4\" data-act=\"lim\"></label>", "line": "Il mio ciclo era: tocca, gira, muoviti, ricorda. Il loro è: leggi, chiama uno strumento, leggi il risultato. Stessa idea, labirinto molto più grande.", "hint": "esecuzione preparata, non un modello dal vivo · il risultato della ricerca cita un articolo reale"}, "14": {"year": "maneggiare con cura", "h2": "Plausibile non vuol dire vero", "ps": ["Un LLM allucina quando produce contenuti che sembrano plausibili ma sono falsi, o non sostenuti dalle fonti che ha ricevuto, presentandoli con la stessa sicurezza dei contenuti corretti. Il modello genera testo probabile, non fatti verificati.", "Uno studio del 2025 sostiene che l’addestramento e i benchmark più diffusi premiano il tirare a indovinare rispetto all’ammettere l’incertezza, come un compito in cui gli errori non tolgono punti. Il NIST chiama il fenomeno confabulazione.", "Quindi non fidarti mai ciecamente di fatti, date, nomi, numeri, citazioni o riferimenti: controllali su fonti primarie e apri i link che ti vengono dati. La risposta sul foglio è stata scritta da noi per imitare un’allucinazione."], "ctrl": "<button class=\"h\" data-act=\"reveal\">controlla sulle fonti</button><button class=\"h\" data-act=\"reset\">ricomincia</button>", "line": "Esisto davvero, giuro: mi potete vedere nel filmato di Shannon del 1952. Visto? Un’affermazione che si può controllare. Fate lo stesso con ogni risposta.", "hint": "tocca le affermazioni di cui non ti fideresti senza controllare"}, "15": {"year": "ripasso", "h2": "Trova l’uscita", "ps": ["Otto domande per ripassare la passeggiata. Si risponde toccando un’opzione: il foglio dei punti sulla mappa tiene il conto.", "Per la classe: giocate a squadre, una domanda per squadra a turno, e chiedete sempre di motivare la risposta prima di toccarla."], "ctrl": "<div class=\"quiz\"><div class=\"q\"></div><div class=\"opts\"></div><div class=\"why\" aria-live=\"polite\"></div><div class=\"ctrl\"><button class=\"h\" data-act=\"next\">domanda successiva</button><button class=\"h\" data-act=\"restart\">ricomincia</button></div></div>", "line": "Ultimo labirinto! Se non siete sicuri di una risposta, ditelo: è proprio quello che vorremmo facessero gli LLM."}, "intro": {"year": "una mappa per la quinta", "h1": "I grandi modelli linguistici", "sub": "Le idee principali, disegnate a matita.", "ps": ["Questa mappa è una passeggiata tra le idee principali dei grandi modelli linguistici: che cosa sono, come vengono addestrati, come diventano assistenti e agenti, e perché possono sbagliare con sicurezza. Ogni tappa ha un piccolo esperimento da provare.", "Percorri il sentiero con la rotellina del mouse, le frecce, uno scorrimento del dito o i bottoni in basso. «Mappa intera» mostra tutto insieme. La forma del terreno è decorativa: colline e valli non misurano nulla.", "La guida è Teseo, il topo meccanico che Claude Shannon costruì nel 1950 per imparare i labirinti. Le poche persone disegnate sono schizzi stilizzati, non ritratti. I numeri indicati come illustrativi sono stati scelti a mano per spiegare un’idea."], "ctrl": "<button class=\"h\" data-nav=\"next\">inizia la passeggiata</button>", "line": "Ciao! Sono Teseo, il topo meccanico che Claude Shannon costruì nel 1950. Imparavo i labirinti con i relè telefonici. Oggi il labirinto è fatto di idee: seguitemi!"}}};

 const c=L.cv.getContext('2d');c.setTransform(kk,0,0,kk,0,0);c.fillStyle=C.sheet;c.fillRect(0,0,640,520);P.ctx=c;P.budget=Infinity;P.used=0;P.dry=false;P.minw=0;P.scale=0;SC[S.scene].draw(L.st);L.k=kk;L.dirty=false}
let FOG=[];
function FOGR(){const S=STOPS[14];return[S.px-1150,S.py-760,S.px+950,S.py+260]}
function makeFog(){FOG=[];const r=mulberry(77);const R=FOGR();for(let i=0;i<30;i++)FOG.push({x:R[0]+r()*(R[2]-R[0]),y:R[1]+r()*(R[3]-R[1]),rx:120+r()*170,ry:26+r()*30,sp:12+r()*20,ph:r()*6})}
let curT=1830;
function draw(){if(FILM&&typeof FILMSKIP!=='undefined'&&FILMSKIP)return false;frameNo++;const a=area(),k=dpr*cam.z;const ox=dpr*(a.x+a.w/2)-k*cam.x,oy=dpr*(a.y+a.h/2)-k*cam.y;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.paper;ctx.fillRect(0,0,cv.width,cv.height);
 const wx0=-ox/k,wy0=-oy/k,wx1=(cv.width-ox)/k,wy1=(cv.height-oy)/k;
 // livello base, sempre pronto
 if(baseCv){const sx=Math.max(0,wx0*BASE),sy=Math.max(0,wy0*BASE),ex=Math.min(baseCv.width,wx1*BASE),ey=Math.min(baseCv.height,wy1*BASE);
  if(ex>sx&&ey>sy)ctx.drawImage(baseCv,sx,sy,ex-sx,ey-sy,ox+k*sx/BASE,oy+k*sy/BASE,k*(ex-sx)/BASE,k*(ey-sy)/BASE)}
 // tasselli
 let L=-1;if(k>BASE*1.3){L=LV.findIndex(s=>s>=k/1.3);if(L<0)L=LV.length-1}
 wantQ=[];const cxw=(wx0+wx1)/2,cyw=(wy0+wy1)/2;
 for(let l=0;l<=L;l++){const s=LV[l],ws=TPX/s;const i0=Math.max(0,Math.floor(wx0/ws)),i1=Math.min(Math.floor(WW/ws),Math.floor(wx1/ws)),j0=Math.max(0,Math.floor(wy0/ws)),j1=Math.min(Math.floor(WH/ws),Math.floor(wy1/ws));
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const key=l+':'+i+':'+j;const t=tiles.get(key);
   if(t){t.last=frameNo;const dx=Math.floor(ox+k*i*ws),dy=Math.floor(oy+k*j*ws),dx2=Math.ceil(ox+k*(i+1)*ws),dy2=Math.ceil(oy+k*(j+1)*ws);ctx.drawImage(t.cv,dx,dy,dx2-dx,dy2-dy)}
   else if(l===L)wantQ.push([key,l,i,j,Math.hypot((i+.5)*ws-cxw,(j+.5)*ws-cyw)])}}
 wantQ.sort((p,q)=>p[4]-q[4]);
 // fogli vivi
 for(const S of STOPS){const Lv=S.n&&live[S.n];if(!Lv)continue;if(S.ox+640<wx0||S.ox>wx1||S.oy+520<wy0||S.oy>wy1)continue;
  const still=!tr;if(Lv.dirty||(still&&STOPS[cur]===S&&Math.abs(Lv.k-Math.min(3,Math.max(.5,k)))/Lv.k>.15))renderLive(S,Lv);
  const dx=Math.round(ox+k*S.ox),dy=Math.round(oy+k*S.oy);ctx.drawImage(Lv.cv,dx,dy,Math.round(ox+k*(S.ox+640))-dx,Math.round(oy+k*(S.oy+520))-dy)}
 // animazioni ambientali, in coordinate di mondo
 ctx.setTransform(k,0,0,k,ox,oy);const T=reduce?0:time;let amb=false;ctx.save();ctx.beginPath();ctx.rect(wx0,wy0,wx1-wx0,wy1-wy0);for(const S of STOPS)if(S.n)ctx.rect(S.sx,S.sy,680,560);ctx.clip('evenodd');
 const vis=(x,y,m)=>x>wx0-m&&x<wx1+m&&y>wy0-m&&y<wy1+m;
 if(cam.z>.1){ctx.lineCap='round';
  for(const[cx,cy]of CHIM)if(vis(cx,cy-200,300)){amb=true;ctx.strokeStyle=C.muted;for(let p=0;p<5;p++){const u=((T*.2+p/5+cx*.001)%1);ctx.globalAlpha=.28*(1-u)*Math.min(1,u*6);ctx.lineWidth=1.5;ctx.beginPath();
   const q=hsh(p,cx)%100/100;ctx.ellipse(cx+u*(60+q*40)+Math.sin(T*1.1+p*2)*10,cy-u*240,10+u*(30+q*20),8+u*22,q*.8,0,Math.PI*2);ctx.stroke()}}
  ctx.globalAlpha=1;let nf=0;
  if(FOG.length){const R=FOGR(),Wd=R[2]-R[0];ctx.fillStyle=C.dark?'#AEB8C4':'#FFFFFF';ctx.strokeStyle=C.muted;ctx.lineWidth=1.6;for(const f of FOG){const x=R[0]+((f.x-R[0]+T*f.sp)%Wd),y=f.y+Math.sin(T*.4+f.ph)*12;if(!vis(x,y,f.rx))continue;nf++;
   ctx.beginPath();ctx.ellipse(x,y,f.rx,f.ry,0,0,Math.PI*2);ctx.globalAlpha=C.dark?.07:.2;ctx.fill();ctx.globalAlpha=.18;ctx.stroke()}}
  ctx.globalAlpha=1;if(nf)amb=true;
  if(WINS.some(w=>vis(w[0],w[1],30))){amb=true;ctx.fillStyle=RC('gold');WINS.forEach((w,i)=>{const per=3+(i*7%5);const on=hsh(i,Math.floor(T/per+i*.37))%100<42;if(on){ctx.globalAlpha=.8;ctx.fillRect(w[0]+1,w[1]+1,w[2]-2,w[3]-2)}});ctx.globalAlpha=1}}
 ctx.restore();
 // Teseo
 if(!TS.hide&&!ov){const p=pathAt(TS.s);if(vis(p.x,p.y,200)){ctx.save();ctx.translate(p.x,p.y+6);ctx.scale(2.2,2.2);P.ctx=ctx;P.budget=Infinity;P.used=0;P.dry=false;P.minw=0;P.scale=0;teseoSide(0,0,TS.dir,TS.ph,TS.walk);ctx.restore()}}
 // luce di stagione
 ctx.setTransform(1,0,0,1,0,0);const w=winterness(curT),warm=lev(curT)*(1-w);
 if(w>0.01||warm>0.01){ctx.globalCompositeOperation=C.dark?'source-over':'multiply';if(w>.01){ctx.fillStyle=`rgba(140,172,215,${(C.dark?.07:.13)*w})`;ctx.fillRect(0,0,cv.width,cv.height)}
  if(warm>.01){ctx.fillStyle=`rgba(255,214,150,${(C.dark?.03:.07)*warm})`;ctx.fillRect(0,0,cv.width,cv.height)}ctx.globalCompositeOperation='source-over'}
 return amb}

/* ================= Teseo ================= */
function teseoSide(x,base,dir,ph,walk){const s=1.25;const X=u=>x+dir*u*s,Y=v=>base-v*s;
 const tail=[];for(let k=0;k<=8;k++){const u=-14-k*2.6;tail.push([X(u),Y(8+Math.sin(k*0.7+ph*0.8)*2.4+k*0.35)])}curve(tail,{w:1.2,passes:1});
 const lg=walk?Math.sin(ph*1.6)*2.5:0;seg(X(-7)+lg,Y(3),X(-8)-lg,Y(0),{w:1.3,passes:1});seg(X(7)-lg,Y(3),X(8)+lg,Y(0),{w:1.3,passes:1});
 const body=ellPoly(X(0),Y(9),15*s,8.5*s,24);solid(body,C.sheet);wash(body,C.muted,.45);hatch(body,{gap:3.5,a:.3,ang:-30});path(body,{w:1.4},true);
 const head=[[X(9),Y(15)],[X(18),Y(14)],[X(26),Y(8)],[X(17),Y(4)],[X(10),Y(5)]];solid(head,C.sheet);wash(head,C.muted,.45);path(head,{w:1.4},true);
 ell(X(12),Y(19),4.2*s,4.6*s,{solid:C.sheet,w:1.2,fill:C.red,fa:.3});dot(X(18),Y(11),1.8);dot(X(26),Y(8),1.9);
 for(const d of[-2,0,2])seg(X(25),Y(8),X(34),Y(8+d*1.6),{w:1,passes:1,col:C.red})}
let bubOn=false,bubUntil=0;
function lineOf(i){const S=STOPS[i];const c=CT()[S.k||S.n];return c&&c.line}
function bubble(on){if(FILM)on=false;const l=lineOf(cur);bubOn=on&&!!l&&!ov&&innerWidth>760;if(bubOn){$('bubt').textContent=l;bubUntil=performance.now()+14000}bub.classList.toggle('on',bubOn);placeBubble()}
function placeBubble(){if(!bubOn)return;const p=pathAt(TS.s);const[sx,sy]=toScreen(p.x,p.y);const a=area();const bw=bub.offsetWidth,bh=bub.offsetHeight;
 let x=sx-34,y=sy+22,up=false;const S=STOPS[cur];if(y+bh>a.y+a.h-6){y=a.y+a.h-bh-6;if(S.n)y=Math.max(y,toScreen(0,S.py-72)[1]);if(y<sy-10){y=Math.max(8,sy-40*cam.z-bh-10);up=true}}x=Math.max(8,Math.min(a.x+a.w-bw-8,x));y=Math.max(8,y);
 bub.style.left=x+'px';bub.style.top=y+'px';bub.classList.toggle('up',up);bub.style.setProperty('--tx',Math.max(14,Math.min(bw-30,sx-x-8))+'px')}

/* ================= pannello e contenuti ================= */
function stopHTML(i){const S=STOPS[i];const c=CT()[S.k||S.n];
 if(!c)return`<div class="year">${S.y}</div><h2>${S.title}</h2><p class="soon">This place is already on the map. Its text and its experiment arrive in the next phase of the project.</p>`;
 let h=`<div class="year">${c.year}</div>`+(c.h1?`<h1>${c.h1}</h1>`:`<h2>${c.h2||S.title}</h2>`)+(c.sub?`<p class="sub">${c.sub}</p>`:'')+(c.line?`<p class="tline"><b>${LX('Theseus','Teseo')}</b> ${c.line}</p>`:'')+c.ps.map(p=>`<p>${p}</p>`).join('');
 if(c.people)h+=`<canvas class="people" data-people='${JSON.stringify(c.people).replace(/'/g,'&#39;')}' aria-hidden="true"></canvas>`;
 if(c.ctrl)h+=`<div class="ctrl">${c.ctrl}</div>`;if(c.hint)h+=`<div class="hint">${c.hint}</div>`;if(c.note)h+=`<p class="note">${c.note}</p>`;return h}
function buildPanel(){const box=$('stops');box.innerHTML='';STOPS.forEach((S,i)=>{const s=document.createElement('section');s.className='stop';s.dataset.i=i;s.setAttribute('aria-label',S.n?`${LX('Stop','Tappa')} ${S.n}: ${S.title}`:LX('Introduction','Introduzione'));s.innerHTML=stopHTML(i);box.appendChild(s);
  s.querySelectorAll('[data-act]').forEach(b=>{const ev=b.tagName==='INPUT'?'input':'click';b.addEventListener(ev,()=>{if(!S.done)return;const L=ensureLive(S);bubble(false);const sc=SC[S.scene];sc.act&&sc.act(L.st,b.dataset.act,b.tagName==='INPUT'?b.value:b.dataset.v,b);L.dirty=true;needs=true})});
  const fm=s.querySelector('form.chat');if(fm)fm.addEventListener('submit',e=>{e.preventDefault();const inp=fm.querySelector('input');const v=inp.value.trim();if(!v)return;inp.value='';const L=ensureLive(S);bubble(false);SC[S.scene].say(L.st,v);L.dirty=true;needs=true});
  s.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='next')go(cur+1);else setOverview(true)}))});
 const ol=$('ovlist');ol.innerHTML='';STOPS.forEach((S,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='ovb';
  b.innerHTML=S.n?`<span class="n">${S.n}</span>${S.title}`:'<span class="n">·</span> '+LX('Start of the trail','Inizio del sentiero');b.onclick=()=>{setOverview(false,i)};li.appendChild(b);ol.appendChild(li)});
 marks.innerHTML='';STOPS.forEach((S,i)=>{const b=document.createElement('button');b.className='mk';b.textContent=S.n||LX('start','inizio');b.setAttribute('aria-label',S.n?`${LX('Go to stop','Vai alla tappa')} ${S.n}: ${S.title}`:LX('Go to the start','Vai all’inizio'));b.onclick=()=>setOverview(false,i);marks.appendChild(b)})}
const LOOKS2=LOOKS;
function drawPeople(cvp){const list=JSON.parse(cvp.dataset.people);const W0=500,H0=104;const k=Math.min(3,(cvp.clientWidth||352)/W0*dpr);cvp.width=Math.round(W0*k);cvp.height=Math.round(H0*k);
 const c=cvp.getContext('2d');c.setTransform(k,0,0,k,0,0);P.ctx=c;P.budget=Infinity;P.used=0;P.dry=false;P.minw=0;P.scale=0;const n=list.length;const w=W0/Math.max(n,3);
 list.forEach(([name,key],i)=>{const cx=i*w+34;person(cx,30,0.6,{...LOOKS2[key],bottom:104});const lines=wrapLines(name,w-80,22);lines.forEach((l,q)=>txt(l,cx+44,54+q*21-(lines.length-1)*10,{size:22,col:C.ink}))})}
function showPanel(i){if(FILM)filmCaption(i);document.querySelectorAll('.stop').forEach(s=>s.classList.toggle('active',+s.dataset.i===i&&!ov));$('ovsec').classList.toggle('active',ov);
 const s=document.querySelector(`.stop[data-i="${i}"]`);if(s&&!ov){s.querySelectorAll('canvas.people').forEach(drawPeople);panel.scrollTop=0}
 const S=STOPS[i];$('sr').textContent=ov?LX('Whole map','Mappa intera'):(S.n?`${LX('Stop','Tappa')} ${S.n} ${LX('of','di')} 15: ${S.title}`:LX('Start of the trail','Inizio del sentiero'));
 $('prev').disabled=i===0&&!ov;$('next').disabled=i===STOPS.length-1&&!ov;setLbl($('ovbtn'),ov?LX('back to the trail','torna al sentiero'):LX('whole map','mappa intera'),ov?LX('trail','sentiero'):LX('map','mappa'));$('ovbtn').setAttribute('aria-pressed',ov);
 history.replaceState(null,'','#'+(ov?'map':S.n?'stop-'+S.n:S.k))}

/* ================= navigazione ================= */
function go(i){i=Math.max(0,Math.min(STOPS.length-1,i));if(ov){setOverview(false,i);return}if(i===cur&&!tr)return;
 const from={...cam},to=viewOf(i),adj=Math.abs(i-cur)===1;const sA=TS.s,sB=STOPS[i].ts;const prevCur=cur;cur=i;bubble(false);showPanel(i);mmDraw();
 if(reduce){cam=to;TS.s=sB;TS.walk=false;TS.dir=STOPS[i].dir;tr=null;arrive();return}
 const a=area();const chord=Math.hypot(to.x-from.x,to.y-from.y);const dist=adj?Math.abs(sB-sA):chord;
 const dur=adj?Math.min(2.8,1.05+dist/5200):Math.min(2.1,1.1+chord/9000);
 let zm=Math.min(from.z,to.z)*Math.min(1,a.w*.9/(Math.abs(to.x-from.x)+900),a.h*.9/(Math.abs(to.y-from.y)+900));if(adj)zm=Math.max(zm,Math.min(from.z,to.z)*.32);
 const pA=pathAt(sA),pB=pathAt(sB);
 tr={t0:NOW(),dur:dur*1000,from,to,adj,sA,sB,offA:[from.x-pA.x,from.y-pA.y],offB:[to.x-pB.x,to.y-pB.y],zm};TS.hide=!adj;needs=true}
function setOverview(on,target){if(on===ov&&target===undefined)return;
 if(on){ov=true;bubble(false);showPanel(cur);const from={...cam},to=overview();if(reduce){cam=to;tr=null}else tr={t0:NOW(),dur:1300,from,to,adj:false,zm:to.z,ovt:true};needs=true;mmDraw();return}
 ov=false;const i=target===undefined?cur:target;const from={...cam},to=viewOf(i);cur=i;showPanel(i);mmDraw();TS.s=STOPS[i].ts;TS.dir=STOPS[i].dir;TS.walk=false;
 if(reduce){cam=to;tr=null;arrive();return}tr={t0:NOW(),dur:1400,from,to,adj:false,zm:to.z};TS.hide=true;needs=true}
function arrive(){TS.hide=false;TS.walk=false;TS.dir=STOPS[cur].dir;const S=STOPS[cur];if(S.done){const L=ensureLive(S);L.dirty=true}needs=true;setTimeout(()=>{if(!tr&&!ov)bubble(true)},reduce?0:350)}
function stepTr(now){const u=Math.min(1,(now-tr.t0)/tr.dur),e=ease(u);const{from,to}=tr;
 const lzA=Math.log(from.z),lzB=Math.log(to.z),lm=Math.log(tr.zm),mid=(lzA+lzB)/2;let lz=lzA+(lzB-lzA)*e;if(lm<mid)lz+=(lm-mid)*Math.sin(Math.PI*e);cam.z=Math.exp(lz);
 if(tr.adj){const s=tr.sA+(tr.sB-tr.sA)*e;const p=pathAt(s);cam.x=p.x+tr.offA[0]+(tr.offB[0]-tr.offA[0])*e;cam.y=p.y+tr.offA[1]+(tr.offB[1]-tr.offA[1])*e;
  const ps=TS.s;TS.s=s;TS.walk=true;TS.ph+=0.35;const q=pathAt(s+1);if(Math.abs(q.dx)>0.01)TS.dir=Math.sign(q.dx)*Math.sign(tr.sB-tr.sA);curT=p.t}
 else{cam.x=from.x+(to.x-from.x)*e;cam.y=from.y+(to.y-from.y)*e;if(!ov)curT=STOPS[cur].t}
 if(u>=1){tr=null;cam={...to};if(!ov){TS.s=STOPS[cur].ts;curT=STOPS[cur].t;arrive()}else curT=STOPS[cur].t}}

/* ================= minimappa ================= */
const mmc=$('mmc'),mmU=t=>(t+0.6)/16.2;
function mmDraw(){const r=mmc.getBoundingClientRect();if(!r.width)return;const k=dpr;mmc.width=Math.round(r.width*k);mmc.height=Math.round(r.height*k);const c=mmc.getContext('2d');c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,r.width,r.height);
 P.ctx=c;P.budget=Infinity;P.used=0;P.dry=false;P.minw=0;P.scale=0;const w=r.width-16,h=r.height,X=t=>8+mmU(t)*w,Y=l=>h-9-l*(h-20);
 for(const[a,b,rg]of REGIONS){const q=[[X(a),4],[X(b),4],[X(b),h-4],[X(a),h-4]];wash(q,RC(rg),.22)}
 const pts=[];for(let t=-0.6;t<=15.6;t+=0.1)pts.push([X(t),Y(lev(t))]);stroke(pts,{w:1.5,passes:1});
 const p=X(curT);ell(p,Y(lev(curT)),5,5,{solid:C.red,w:1.2,passes:1});
 const bs=$('mmdots').children;STOPS.forEach((S,i)=>{const b=bs[i];if(!b)return;b.style.left=(X(S.t)-7)+'px';b.style.top=(Y(lev(S.t))-7)+'px';b.classList.toggle('cur',i===cur&&!ov)})}
function mmBuild(){const d=$('mmdots');d.innerHTML='';STOPS.forEach((S,i)=>{const b=document.createElement('button');b.className='md';b.setAttribute('aria-label',S.n?`${LX('Stop','Tappa')} ${S.n}: ${S.title}`:LX('Start of the trail','Inizio del sentiero'));b.title=S.n?`${S.n} · ${S.title}`:LX('Start','Inizio');
 b.onclick=()=>{if(ov)setOverview(false,i);else go(i)};d.appendChild(b)})}

/* ================= segnalini della vista d'insieme ================= */
function placeMarks(){marks.classList.toggle('on',ov&&!tr);if(!ov)return;const bs=marks.children;STOPS.forEach((S,i)=>{const[x,y]=S.n?toScreen(S.px,S.py-360):toScreen(S.px,S.py-200);const b=bs[i];b.style.left=x+'px';b.style.top=y+'px';b.classList.toggle('cur',i===cur)})}

/* ================= ingressi ================= */
let wacc=0,wlast=0,quiet=false;
addEventListener('wheel',e=>{if(e.target.closest('#panel,#bar'))return;e.preventDefault();const now=performance.now();
 if(tr||ov){wlast=now;quiet=true;return}if(quiet){if(now-wlast>180)quiet=false;else{wlast=now;return}}
 if(now-wlast>260)wacc=0;wlast=now;const d=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;wacc+=d*(e.deltaMode===1?32:1);
 if(Math.abs(wacc)>60){go(cur+Math.sign(wacc));wacc=0;quiet=true}},{passive:false});
addEventListener('keydown',e=>{const t=e.target;if(t.tagName==='INPUT'||t.tagName==='TEXTAREA')return;
 if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)||(e.key===' '&&t===document.body)){e.preventDefault();go(cur+1)}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(STOPS.length-1)}
 else if(e.key==='o'||e.key==='O')setOverview(!ov);else if(e.key==='Escape'&&ov)setOverview(false)});
let pmode=null,px0=0,py0=0,pressed=false;
function sheetHit(sx,sy){const S=STOPS[cur];if(ov||tr||!S.done)return null;const[wx,wy]=toWorld(sx,sy);const lx=wx-S.ox,ly=wy-S.oy;return lx>=0&&lx<=640&&ly>=0&&ly<=520?[lx,ly]:null}
cv.addEventListener('pointerdown',e=>{px0=e.clientX;py0=e.clientY;pressed=true;
 if(!ov&&!tr){const p=pathAt(TS.s);const[tx,ty]=toScreen(p.x,p.y-30);if(Math.hypot(e.clientX-tx,e.clientY-ty)<46*Math.max(.6,cam.z)+10&&lineOf(cur)){bubble(!bubOn);pmode=null;return}}
 const h=sheetHit(e.clientX,e.clientY);if(h){const S=STOPS[cur],L=ensureLive(S);pmode='scene';bubble(false);try{cv.setPointerCapture(e.pointerId)}catch(_){}const sc=SC[S.scene];if(sc.down){sc.down(L.st,h[0],h[1]);L.dirty=true;needs=true}return}
 pmode='swipe'});
cv.addEventListener('pointermove',e=>{const h=sheetHit(e.clientX,e.clientY);cv.style.cursor=h?'crosshair':'default';
 if(pmode==='scene'){const S=STOPS[cur],L=ensureLive(S);const[wx,wy]=toWorld(e.clientX,e.clientY);const sc=SC[S.scene];if(sc.move){sc.move(L.st,wx-S.ox,wy-S.oy,pressed);L.dirty=true;needs=true}}});
function pup(e){if(pmode==='scene'){const S=STOPS[cur],L=live[S.n];const sc=SC[S.scene];if(L&&sc.up){sc.up(L.st);L.dirty=true;needs=true}}
 else if(pmode==='swipe'){const dx=e.clientX-px0,dy=e.clientY-py0;if(Math.max(Math.abs(dx),Math.abs(dy))>50){const d=Math.abs(dx)>Math.abs(dy)?dx:dy;if(ov)return;go(cur+(d<0?1:-1))}}pmode=null;pressed=false}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',()=>{pmode=null;pressed=false});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('ovbtn').onclick=()=>setOverview(!ov);
bub.addEventListener('click',()=>bubble(false));
$('fold').onclick=()=>{const c=panel.classList.toggle('folded');$('fold').setAttribute('aria-expanded',!c);setLbl($('fold'),c?LX('show text','mostra testo'):LX('hide text','nascondi testo'),LX('text','testo'));onResize()};

 cv.setAttribute('aria-label',LX('A hand-drawn landscape: the main ideas about large language models as a trail with fifteen stops. The text for each stop is in the side panel.','Un paesaggio disegnato a mano: le idee principali sui grandi modelli linguistici come un sentiero con quindici tappe. Il testo di ogni tappa è nel pannello laterale.'));

 const ovs=$('ovsec');ovs.setAttribute('aria-label',LX('Whole map','Mappa intera'));ovs.querySelector('.year').textContent=LX('fifteen stops','quindici tappe');ovs.querySelector('h2').textContent=LX('The whole map','La mappa intera');ovs.querySelector('p').textContent=LX('Pick a stop on the map or in this list.','Scegli una tappa sulla mappa o in questo elenco.');
 bub.querySelector('b').textContent=LX('Theseus','Teseo');$('loading').textContent=LX('sketching the map…','disegno la mappa…');$('mmnote').textContent=LX('the shape of the land is decorative','la forma del terreno è decorativa');
 bar.setAttribute('aria-label',LX('Trail navigation','Navigazione del sentiero'));$('prev').setAttribute('aria-label',LX('Previous stop','Tappa precedente'));$('next').setAttribute('aria-label',LX('Next stop','Tappa successiva'));
 const f=$('fold');setLbl(f,panel.classList.contains('folded')?LX('show text','mostra testo'):LX('hide text','nascondi testo'),LX('text','testo'));

function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem('llm-map-lang',l)}catch(e){}applyData();for(const k in live)delete live[k];bubble(false);uiText();buildPanel();mmBuild();
 $('loading').classList.add('on');setTimeout(()=>{rebuild();$('loading').classList.remove('on');showPanel(cur);mmDraw();if(!ov)arrive();else placeMarks()},30)}
$('lang').onclick=()=>setLang(LANG==='it'?'en':'it');
/* ================= avvio, tema, ridimensionamento ================= */
function sizeCanvas(){W=innerWidth;H=innerHeight;dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px'}
function onResize(){sizeCanvas();if(!tr)cam=ov?overview():viewOf(cur);mmDraw();document.querySelectorAll('.stop.active canvas.people').forEach(drawPeople);needs=true}
addEventListener('resize',onResize);

let lastT=0;
function tickAll(now,dt){time+=dt;
 if(tr){stepTr(now);needs=true;mmDraw()}
 const S=STOPS[cur];const L=S.done&&live[S.n];if(L&&L.st.anim&&SC[S.scene].tick){SC[S.scene].tick(L.st,dt);L.dirty=true;needs=true}
 if(bubOn&&now>bubUntil)bubble(false);
 if(needs||(!reduce&&ambOn)){needs=false;ambOn=draw();placeBubble();placeMarks()}}
function loop(now){const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;tickAll(now,dt);genTiles(tr?4:10);requestAnimationFrame(loop)}
let ambOn=false;
async function start(){if(FILM)filmSetup();readAll();makeGrain();sizeCanvas();uiText();buildPanel();mmBuild();
 const h=location.hash.slice(1);if(h.startsWith('stop-')){const n=+h.slice(5);const i=STOPS.findIndex(S=>S.n===n);if(i>=0)cur=i}else if(h==='end')cur=STOPS.length-1;
 try{await Promise.race([Promise.all(['400 30px Caveat','600 30px Caveat','400 18px Newsreader','500 30px Newsreader'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))])}catch(_){}
 rebuild();$('loading').classList.remove('on');
 showPanel(cur);cam=viewOf(cur);TS.s=STOPS[cur].ts;TS.dir=STOPS[cur].dir;curT=STOPS[cur].t;mmDraw();
 if(h==='map')setOverview(true);else arrive();
 ready=true;if(FILM){VCLOCK=0;filmReady()}else requestAnimationFrame(loop)}
start();
