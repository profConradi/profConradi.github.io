  case'whoosh':{const s=AC.createBufferSource(),bf=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;s.loop=true;bf.type='bandpass';bf.Q.value=1.6;bf.frequency.setValueAtTime(500,at);bf.frequency.exponentialRampToValueAtTime(2200,at+.5);bf.frequency.exponentialRampToValueAtTime(400,at+1.1);env(g,at,.35,.07*v,.8);s.connect(bf);bf.connect(g);g.connect(S);s.start(at);s.stop(at+1.3);}break;
  case'stamp':nz(at,.18,.35,'lowpass',500,.8,S);osc('sine',110,at,.2,.25,.002,S);break;
  case'crash':nz(at,.9,.35,'lowpass',1600,.6,S);{const o=osc('sine',70,at,2.6,.45,.003,S);o.frequency.exponentialRampToValueAtTime(28,at+2.2);}break;
  case'tock':{const o=osc('sine',1500+(v%3)*90,at,.06,.08,.001,S);o.frequency.exponentialRampToValueAtTime(900,at+.05);}break;
  case'type':nz(at,.02,.06,'bandpass',2500+Math.random()*1500,2,S);break;
  case'glass':[2100,2650,3300].forEach((f,k)=>osc('sine',f,at+k*.01,.5,.025,.001,S));break;
  case'shimmer':[86,90,93,98].forEach((m,k)=>osc('sine',mtof(m),at+k*.07,1.6,.03,.003,S));break;
}}
function schedule(){if(!AC||!bus||!playing||AC.state!=='running')return;const now=AC.currentTime+.03,horizon=T+.25;
  for(const ev of EV){if(ev[0]>=schedT&&ev[0]<horizon&&ev[0]>=T-.06){try{play(ev,now+Math.max(0,ev[0]-T));}catch(e){}}}schedT=horizon;}
function startAudio(){unlockIOS();ensureAudio();if(!AC)return;newBus();schedT=T;
  const go=()=>{schedT=T;};
  if(AC.state!=='running'){const p=AC.resume&&AC.resume();if(p&&p.then)p.then(go).catch(()=>{});}else go();
  setTimeout(()=>{if(!AC)return;if(AC.state!=='running'&&audioOn){sndB.dataset.blocked='1';}else if(audioOn){delete sndB.dataset.blocked;}sndLabel();},700);}
function stopAudio(){if(AC&&bus){bus.gain.setTargetAtTime(0,AC.currentTime,.03);bus=null;}if(AC&&mbus){mbus.gain.setTargetAtTime(0,AC.currentTime,.03);mbus=null;}}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');let SF=1,ready=false;
function render(tt){if(!ready)return;c=ctx;ctx.setTransform(SF,0,0,SF,0,0);if(tt>=214&&!THUMBS.length)buildThumbs();frame(tt);}
function size(){const r=cv.getBoundingClientRect();if(!r.width)return false;const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(Math.min(r.width*dpr,2000));if(cv.width===pw&&PAPERC)return false;cv.width=pw;cv.height=Math.round(pw*9/16);SF=pw/W;buildPaper(cv.width,cv.height);return true;}
const playB=document.getElementById('play'),replayB=document.getElementById('replay'),sndB=document.getElementById('snd'),scrub=document.getElementById('scrub'),out=document.getElementById('time'),chap=document.getElementById('chap');
let T=117,playing=false,started=false,last=0;
const fmt=x=>num(x,1);
const CHAPS=[[['prologo','prologue'],0],[['Lucrezio','Lucretius'],16.2],[['Brown','Brown'],27],[['Bachelier','Bachelier'],63.6],[['Einstein','Einstein'],85.8],[['Perrin','Perrin'],120.2],[['finanza','finance'],156.4],[['diffusione','diffusion'],184.6],[['epilogo','epilogue'],215.4]];
const CHB=CHAPS.map(([n,t0])=>{const b=document.createElement('button');b.type='button';b.textContent=S(...n);b.addEventListener('click',()=>{T=t0;started=true;if(playing){stopAudio();startAudio();}draw();});chap.appendChild(b);return b;});
function setBtn(){playB.textContent=playing?S('Pausa','Pause'):(T>=DUR?S('Rivedi','Watch again'):S('Avvia','Play'));}
function draw(){render(T);scrub.value=T;out.textContent=`${fmt(T)} s / ${fmt(DUR)} s`;let ci=0;CHAPS.forEach(([,t0],k)=>{if(T>=t0)ci=k;});CHB.forEach((b,k)=>b.setAttribute('aria-current',k===ci?'true':'false'));}
function tick(now){if(!playing)return;const dt=Math.min(.05,(now-last)/1000);last=now;T=Math.min(DUR,T+dt);
  if(T>=DUR){T=DUR;playing=false;stopAudio();setBtn();}schedule();draw();if(playing)requestAnimationFrame(tick);}
function start(from){if(!ready)return;if(from!=null)T=from;started=true;playing=true;last=performance.now();if(audioOn)startAudio();setBtn();requestAnimationFrame(tick);}
function pause(){playing=false;stopAudio();setBtn();}
playB.addEventListener('click',()=>{if(playing){pause();return;}start(!started||T>=DUR?0:null);});
replayB.addEventListener('click',()=>{stopAudio();start(0);});
sndB.addEventListener('click',()=>{if(sndB.dataset.blocked&&AC){unlockIOS();AC.resume().then(()=>{delete sndB.dataset.blocked;sndLabel();schedT=T;if(playing&&!bus)newBus();}).catch(()=>{});return;}
  audioOn=!audioOn;sndLabel();sndB.setAttribute('aria-pressed',audioOn);if(master)master.gain.setTargetAtTime(audioOn?.75:0,AC.currentTime,.05);if(audioOn&&playing&&!bus)startAudio();});
document.getElementById('mus').addEventListener('input',e=>{MUSV=+e.target.value;if(mbus)mbus.gain.setTargetAtTime(MUSV*.55,AC.currentTime,.05);});
scrub.addEventListener('input',()=>{T=+scrub.value;started=true;if(playing)pause();draw();});
function sndLabel(){if(sndB.disabled)return;sndB.textContent=sndB.dataset.blocked?S('Suono bloccato: tocca qui','Sound blocked: tap here'):audioOn?S('Suono: sì','Sound: on'):S('Suono: no','Sound: off');}
const UI={
  home:['← articoli','← articles'],
  title:['Dal polline al pixel','From Pollen to Pixel'],

function applyLang(){document.documentElement.lang=LANG;
  document.getElementById('home').textContent=S(...UI.home);document.getElementById('h1').textContent=S(...UI.title);document.getElementById('sub').textContent=S(...UI.sub);replayB.textContent=S(...UI.restart);
  document.getElementById('mvl').textContent=S(...UI.music);document.getElementById('chapl').textContent=S(...UI.chap);scrub.setAttribute('aria-label',S(...UI.scrub));

  setBtn();sndLabel();draw();}
document.querySelectorAll('#langg button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.l;try{localStorage.setItem('polline-lang',LANG);}catch(e){}applyLang();}));
