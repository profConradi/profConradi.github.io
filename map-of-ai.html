<style>
:root{
  --paper:#ECEEE8; --ink:#2A2C2E; --muted:#5C605C; --blue:#2C5A8C; --red:#B5452F;

}

  :root:not([data-theme="light"]){

  }
}

  --paper:#1C2025; --ink:#DCDFD8; --muted:#A4AAA3; --blue:#8DB5DD; --red:#E8927C;

}

body{margin:0;height:100%;background-color:var(--paper);background-image:var(--grain,none);color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
#map{position:fixed;left:0;top:0;display:block;touch-action:none;outline:none}
#panel{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(var(--barh) + 10px + env(safe-area-inset-bottom,0px));width:392px;
  overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 18px;background-color:var(--paper);background-image:var(--grain,none);
  border:1.6px solid var(--ink);border-radius:14px 6px 16px 8px/8px 16px 6px 14px;z-index:5}
.stop,#ovsec{display:none}.stop.active,#ovsec.active{display:block}
.year{font-family:var(--hand);font-size:34px;font-weight:600;color:var(--red);line-height:1;margin:0 0 4px}
h1{font-size:36px;font-weight:500;line-height:1.05;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:29px;font-weight:500;line-height:1.1;margin:0 0 12px;letter-spacing:-.005em}

#panel p.note,#panel p.soon{font-size:15.5px;color:var(--muted);font-style:italic;border-top:1.2px dashed var(--line);padding-top:8px;margin-top:10px}

.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:10px}
.hint{font-family:var(--hand);font-size:22px;color:var(--blue);margin-top:6px;line-height:1.1}

  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:3px 14px 4px;cursor:pointer}

button:focus-visible,input:focus-visible{outline:2px dashed var(--blue);outline-offset:3px}
label.rng{font-family:var(--hand);font-size:21px;display:flex;align-items:center;gap:8px}

.ovb:hover{background:color-mix(in srgb,var(--yellow) 28%,transparent)}

#bar .nav{font-size:24px;padding:0 14px}
#mm{flex:1;position:relative;height:54px;min-width:0}
#mmc{position:absolute;inset:0;width:100%;height:100%}
#mmdots{position:absolute;inset:0}
#bar .md{position:absolute;width:14px;height:14px;padding:0;border:1.4px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer}

#bar .md:hover{background:var(--yellow)}
#mmnote{position:absolute;left:4px;bottom:-3px;font-family:var(--hand);font-size:14px;color:var(--muted);pointer-events:none;white-space:nowrap}

#marks.on{display:block}

  color:var(--ink);background:var(--sheet);border:1.8px solid var(--ink);border-radius:50% 46% 52% 48%;cursor:pointer}
.mk:hover,.mk.cur{background:var(--yellow);color:#2A2C2E}
#bub{position:fixed;left:0;top:0;max-width:min(340px,80vw);padding:9px 15px 11px;font-family:var(--hand);font-size:20px;line-height:1.15;color:var(--ink);background:var(--sheet);
  border:1.6px solid var(--ink);border-radius:18px 8px 20px 10px/10px 20px 8px 18px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;pointer-events:none;z-index:7;cursor:pointer}
#bub.on{opacity:1;transform:none;pointer-events:auto}
#bub b{display:block;font-weight:600;font-size:17px;color:var(--red);margin-bottom:2px}
#bub::after{content:"";position:absolute;top:-9px;left:var(--tx,30px);width:16px;height:16px;background:var(--sheet);border-left:1.6px solid var(--ink);border-top:1.6px solid var(--ink);transform:rotate(45deg) skewX(8deg)}

#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-family:var(--hand);font-size:34px;color:var(--muted);background:var(--paper);z-index:20}
#loading.on{display:flex}
#fold{display:none}

  #bar .md{width:11px;height:11px}
  .mk{min-width:26px;height:26px;font-size:16px;padding:0 5px}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(var(--barh) + 8px + env(safe-area-inset-bottom,0px));max-height:38vh;padding:12px 16px 10px}
  #panel.folded{display:none}
  #fold{display:inline-block;font-size:18px!important;padding:2px 10px!important}
  h1{font-size:28px}h2{font-size:24px}.year{font-size:28px}#panel p{font-size:16px}
  #bar{gap:6px;padding:0 8px env(safe-area-inset-bottom,0px)}#bar button{font-size:18px;padding:2px 9px}#bar .nav{padding:0 10px}

#top{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;display:flex;gap:8px;align-items:center}
#home,#lang{font-family:var(--hand);font-size:21px;line-height:1.15;cursor:pointer;
  text-decoration:none;color:var(--ink);background-color:var(--paper);background-image:var(--grain,none);border:1.6px solid var(--ink);
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:3px 14px 4px}
#home:hover,#lang:hover{background-color:color-mix(in srgb,var(--yellow) 28%,transparent)}
#home:focus-visible,#lang:focus-visible{outline:2px dashed var(--blue);outline-offset:3px}
body.film #top{display:none!important}
@media (max-width:760px){#top{left:8px;gap:6px}#home,#lang{font-size:18px;padding:2px 10px}}
#home{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;font-family:var(--hand);font-size:21px;line-height:1.15;
  text-decoration:none;color:var(--ink);background-color:var(--paper);background-image:var(--grain,none);border:1.6px solid var(--ink);
  border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:3px 14px 4px}
#home:hover{background-color:color-mix(in srgb,var(--yellow) 28%,transparent)}
#home:focus-visible{outline:2px dashed var(--blue);outline-offset:3px}
body.film #home{display:none!important}
@media (max-width:760px){#home{left:8px;font-size:18px;padding:2px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="top"><a id="home" href="articles.html">← articles</a><button id="lang" aria-label="Leggi in italiano" lang="it"><span class="lg-l">italiano</span><span class="lg-s">IT</span></button></div>
<canvas id="map" role="img" aria-label="A hand-drawn landscape: the history of artificial intelligence as a trail from 1843 to today. Hills are periods of enthusiasm, snowy valleys are the two AI winters. The text for each stop is in the side panel."></canvas>

 <div id="stops"></div>

</aside>

 <button class="nav" id="prev" aria-label="Previous stop">←</button>
 <div id="mm"><canvas id="mmc" aria-hidden="true"></canvas><div id="mmdots"></div><span id="mmnote">summers and winters, qualitative; time squeezed before 1940</span></div>
 <button class="nav" id="next" aria-label="Next stop">→</button>
 <button id="ovbtn" aria-pressed="false">whole map</button>
 <button id="fold" aria-expanded="true">hide text</button>

</nav>
<div id="sr" class="sr" aria-live="polite"></div>

<script>
"use strict";
const HAND='"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive';
const HS=1.06;
const SERIF='"Newsreader",Georgia,serif';
const C={};
/* lingua: ?lang=it|en, poi la scelta salvata, poi la lingua del browser */
let LANG=(()=>{let l=null;try{l=new URLSearchParams(location.search).get('lang')}catch(_){}
 if(l!=='it'&&l!=='en'){try{l=localStorage.getItem('mapai-lang')}catch(_){l=null}}
 if(l!=='it'&&l!=='en')l=/^it\b/i.test(navigator.language||'')?'it':'en';return l})();
const isIT=()=>LANG==='it';
const LX=(en,it)=>LANG==='it'?it:en;
function isDark(){const t=document.documentElement.dataset.theme;if(t==='dark')return true;if(t==='light')return false;return matchMedia('(prefers-color-scheme: dark)').matches}
function readColors(){const cs=getComputedStyle(document.documentElement);for(const k of['paper','ink','muted','blue','red','yellow','green','line'])C[k]=cs.getPropertyValue('--'+k).trim();C.dark=isDark()}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(){let h=2166136261>>>0;for(let i=0;i<arguments.length;i++){h^=(Math.round(arguments[i])|0);h=Math.imul(h,16777619)}return h>>>0}
const P={ctx:null,budget:Infinity,used:0,dry:false,minw:0,scale:0,
  take(len){const u0=this.used;this.used+=len;if(this.dry)return 0;if(this.budget===Infinity)return 1;return Math.max(0,Math.min(1,(this.budget-u0)/len))}};
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function cut(p,f){if(f>=1)return p;const L=plen(p)*f;let acc=0;const o=[p[0]];for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(acc+d>=L){const r=d?(L-acc)/d:0;o.push([p[i-1][0]+(p[i][0]-p[i-1][0])*r,p[i-1][1]+(p[i][1]-p[i-1][1])*r]);return o}acc+=d;o.push(p[i])}return o}
function smooth(ctx,q){ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);if(q.length<3){for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1])}else{for(let i=1;i<q.length-1;i++){ctx.quadraticCurveTo(q[i][0],q[i][1],(q[i][0]+q[i+1][0])/2,(q[i][1]+q[i+1][1])/2)}ctx.lineTo(q[q.length-1][0],q[q.length-1][1])}ctx.stroke()}
function stroke(pts,o={}){if(pts.length<2)return;const L=plen(pts)||1;const f=P.take(L*(o.speed??1));if(f<=0)return;const ctx=P.ctx;
  const n=pts.length-1;const r=mulberry(hsh(pts[0][0]/3,pts[0][1]/3,pts[n][0]/3,pts[n][1]/3,n,o.seed||0));
  const passes=o.passes??2,j=o.jit??0.8,w=o.w??1.5,a=o.a??0.9;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=o.col||C.ink;if(o.dash)ctx.setLineDash(o.dash);
  for(let p=0;p<passes;p++){ctx.globalAlpha=a*(p?0.42:1);ctx.lineWidth=Math.max(P.minw,w*(p?0.7:1));const q=pts.map(t=>[t[0]+(r()-.5)*2*j,t[1]+(r()-.5)*2*j]);smooth(ctx,cut(q,f))}
  ctx.restore()}
function seg(x1,y1,x2,y2,o={}){const L=Math.hypot(x2-x1,y2-y1);if(L<0.5)return;const n=Math.max(2,Math.ceil(L/16));const r=mulberry(hsh(x1/3,y1/3,x2/3,y2/3,9));
  const bow=(r()-.5)*Math.min(L*0.03,6)*(o.bow??1);const nx=-(y2-y1)/L,ny=(x2-x1)/L;const pts=[];
  for(let i=0;i<=n;i++){const t=i/n,b=Math.sin(Math.PI*t)*bow;pts.push([x1+(x2-x1)*t+nx*b,y1+(y2-y1)*t+ny*b])}stroke(pts,o)}
function resample(pts,closed,step=14){const a=closed?[...pts,pts[0]]:pts;const out=[];for(let i=0;i<a.length-1;i++){const[x1,y1]=a[i],[x2,y2]=a[i+1];const L=Math.hypot(x2-x1,y2-y1);const n=Math.max(1,Math.ceil(L/step));for(let k=(i?1:0);k<=n;k++){const t=k/n;out.push([x1+(x2-x1)*t,y1+(y2-y1)*t])}}return out}
function path(pts,o={},closed=false){stroke(resample(pts,closed),o)}
function curve(pts,o={}){stroke(pts,o)}
function ellPoly(cx,cy,rx,ry,n=28){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function ell(cx,cy,rx,ry,o={}){if(o.solid)solid(ellPoly(cx,cy,rx,ry,36),o.solid);if(o.fill)wash(ellPoly(cx,cy,rx,ry),o.fill,o.fa??0.55);if(o.hatch)hatch(ellPoly(cx,cy,rx,ry),o.hatch);if(o.nostroke)return;
  const r=mulberry(hsh(cx/3,cy/3,rx*3,ry*3,3));const a0=r()*Math.PI*2,over=o.over??(0.3+r()*0.3);const n=Math.max(12,Math.ceil((rx+ry)*Math.PI/7));const wob=o.wob??0.035,ph=r()*6;const pts=[];
  for(let i=0;i<=n;i++){const a=a0+(Math.PI*2+over)*i/n;const k=1+Math.sin(a*2+ph)*wob*0.5+(i/n-0.5)*wob;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}stroke(pts,o)}
function box(x,y,w,h,o={}){const p=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];if(o.solid)solid(p,o.solid);if(o.fill)wash(p,o.fill,o.fa??0.5);if(o.hatch)hatch(p,o.hatch);if(!o.nostroke)path(p,o,true)}
function solid(poly,col){raw(10,ctx=>{ctx.fillStyle=col;ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()})}
function wash(poly,col,a=0.45){const f=P.take(25);if(f<=0)return;const ctx=P.ctx;const r=mulberry(hsh(poly[0][0]/3,poly[0][1]/3,poly.length,77));
  ctx.save();ctx.fillStyle=col;if(!C.dark)ctx.globalCompositeOperation='multiply';
  for(let k=0;k<3;k++){ctx.globalAlpha=a*f*(k?0.3:0.55);ctx.beginPath();poly.forEach((p,i)=>{const x=p[0]+(r()-.5)*3.5,y=p[1]+(r()-.5)*3.5;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill()}ctx.restore()}
function hatch(poly,o={}){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of poly){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+2,ang=(o.ang??-50)*Math.PI/180,gap=o.gap??6;if(P.scale&&gap*P.scale<1.3){if(P.dry)return;const c=P.ctx;c.save();c.fillStyle=o.col||C.ink;c.globalAlpha=(o.a??0.45)*0.22;c.beginPath();poly.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();c.restore();return}const n=Math.floor(2*R/gap);if(n<1)return;
  const f=P.take(n*3);if(f<=0)return;const ctx=P.ctx;const r=mulberry(hsh(cx/3,cy/3,R,gap*10));const dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx;
  ctx.save();ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.clip();

const HPAT=[["##########","##########","    ##    ","    ##    ","    ##    ","    ##    ","    ##    ","    ##    ","    ##    ","    ##    "],

  people:[['John McCarthy','mccarthy'],['Marvin Minsky','minsky'],['Allen Newell','newell'],['Herbert Simon','simon']],
  ctrl:'<button class="h" data-act="next">next step</button><button class="h" data-act="thm" data-v="2.01" aria-pressed="true">theorem ✱2.01</button><button class="h" data-act="thm" data-v="2.02" aria-pressed="false">theorem ✱2.02</button>',
  hint:'three steps, from an axiom to the theorem',
  note:'Both proofs are the ones given in <cite>Principia</cite>, in modern symbols. They show the kind of chain the Logic Theorist searched for.',
  line:'My builder Shannon signed the Dartmouth proposal. The name “artificial intelligence” is credited to McCarthy.'},
 7:{year:'1958',
  ps:['In 1958 psychologist Frank Rosenblatt presented the perceptron, first simulated on an IBM 704 computer and then built as a machine, the Mark I: 400 photocells in a 20 × 20 grid, with weights set by electric motors.',
   'What was new is that it learns from examples: when it gets one wrong, it nudges the weights in the right direction. If the data can be split by a straight line (a hyperplane, in more dimensions), the algorithm is proved to find one in a finite number of steps.',
   'The New York Times reported that the US Navy expected a machine that could walk, talk, see and even be conscious of its existence.'],
  people:[['Frank Rosenblatt','rosenblatt']],
  ctrl:'<button class="h" data-act="step">one step</button><button class="h" data-act="train">train</button><button class="h" data-act="cls" aria-pressed="false">add: ○</button><button class="h" data-act="new">new data</button>',
  hint:'click on the sheet to add points',
  line:'I learned my maze by remembering. The perceptron learns by correcting its own mistakes, one example at a time.'},
 8:{year:'1966',
  ps:['At MIT Joseph Weizenbaum wrote ELIZA, described in a paper published in 1966. Its best-known script, DOCTOR, imitates a psychotherapist who turns the patient\'s sentences back into questions.',
   'ELIZA understands nothing: it looks for keywords and applies transformation rules. Yet many users confided in it; Weizenbaum\'s secretary once asked him to leave the room so that she could “talk” to it in private.',
   'The tendency to credit a machine with understanding when it produces plausible sentences is now called the ELIZA effect.'],
  people:[['Joseph Weizenbaum','weizenbaum']],
  ctrl:'<form class="chat"><input type="text" aria-label="Write to ELIZA" placeholder="write here and press Enter" autocomplete="off"><button class="h" type="submit">send</button></form>',
  hint:'try: “I feel tired”, “my mother…”, “I am always late”',
  note:'The opening line comes from the DOCTOR script; the other rules were written for this page, in its style.',
  line:'ELIZA never understood a word, and people still told it their secrets. Keep that in mind when we reach the city.'},
 10:{year:'1970s',
  ps:['In the 1970s AI changed strategy: instead of chasing general intelligence, it collected experts\' knowledge as “if… then” rules. MYCIN, developed at Stanford as Edward Shortliffe\'s doctoral work, identified bacteria in severe infections and suggested antibiotics, using about 600 rules.',
   'MYCIN reasoned backward: it started from a hypothesis and asked only the questions it needed to test it. Asked “why?”, it could say which rule it was trying.',
   'In a 1979 evaluation its advice was rated acceptable at least as often as that of Stanford specialists, yet it was never used in clinical practice. In the 1980s rule-based expert systems became an industry.'],
  people:[['Edward Shortliffe','shortliffe'],['Bruce Buchanan','buchanan']],
  ctrl:'<button class="h" data-act="yes">yes</button><button class="h" data-act="no">no</button><button class="h" data-act="restart">start over</button>',
  hint:'think of an animal and answer: the system asks only what it needs',
  note:'The rules about animals are adapted from a classic textbook example; they are not MYCIN\'s medical rules.',
  line:'Snowed in, the rule-makers kept working. Notice that the system asks only what it needs, and can always tell you why it is asking.'},
 11:{year:'1982',
  ps:['In 1982 physicist John Hopfield showed how a network of neurons can work as a memory. Every neuron is connected to all the others, and the stored patterns are written into the connection weights.',
   'Start the network from a damaged pattern and let the neurons update one at a time: a quantity called energy never goes up, and the network usually settles into the stored memory closest to where it started. The mathematics is closely related to models of magnetic materials called spin glasses.',
   'Too many memories confuse it: a network of N neurons reliably stores only about 0.14 N patterns. In 2024 Hopfield shared the Nobel Prize in Physics with Geoffrey Hinton.'],
  people:[['John Hopfield','hopfield'],['Geoffrey Hinton','hinton']],
  ctrl:'<button class="h" data-act="recall">recall</button><button class="h" data-act="noise">add noise</button><button class="h" data-act="pat" data-v="0">T</button><button class="h" data-act="pat" data-v="1">L</button><button class="h" data-act="pat" data-v="2">X</button>',
  hint:'click cells to damage the pattern, then press “recall”',
  note:'The grid has 100 neurons and stores 3 patterns.',
  line:'A memory that repairs itself: show it a damaged picture and it finds the rest. My relays could never do that.'},
 12:{year:'1986',
  ps:['To train a network with several layers, you need to know how much each weight, including the hidden ones, contributed to the final error. Backpropagation computes it with the chain rule: the error travels backward, layer by layer.',
   'The idea has roots in the 1960s and 1970s (Kelley, Bryson, Linnainmaa, Werbos), but it became famous in 1986 with a paper in <cite>Nature</cite> by Rumelhart, Hinton and Williams, whose networks learned internal representations. The network on the sheet, with three hidden neurons, learns XOR.',
   'A year later the market for Lisp machines, computers built to run Lisp, the main language of AI, collapsed; expert systems proved costly to maintain. Funding dried up again: the second AI winter, about 1987–1993.'],
  people:[['David Rumelhart','rumelhart'],['Geoffrey Hinton','hinton'],['Ronald Williams','williams']],
  ctrl:'<button class="h" data-act="train">train</button><button class="h" data-act="reset">new random weights</button>',
  hint:'blue forward, red backward; thicker line = larger weight, dashed = negative',
  line:'The XOR pass again, and this time three hidden neurons get over it. Enjoy the view: right after this ridge the trail drops into the second winter.'},
 13:{year:'1997',
  ps:['In February 1996, in Philadelphia, world champion Garry Kasparov beat IBM\'s Deep Blue 4–2. In the rematch of May 1997, in New York, the machine won 3½–2½: Kasparov took the first game, Deep Blue the second and the decisive sixth, and the other three were drawn.',
   'Deep Blue did not imitate a grandmaster\'s thinking. With purpose-built chips it evaluated about 200 million positions per second, explored the tree of possible moves and skipped useless branches with alpha-beta pruning.',
   'It was a triumph of brute-force search, guided by an evaluation function written by people.'],
  people:[['Garry Kasparov','kasparov'],['Feng-hsiung Hsu','hsu']],
  ctrl:'<label class="rng">depth <input type="range" min="1" max="12" value="4" data-act="depth"></label>',
  hint:'how many positions if you look d half-moves ahead?',
  line:'Deep Blue never learned from its games: it searched, very fast. My maze had 25 squares; chess has far more positions than anyone could ever count.'},
 14:{year:'2012',
  ps:['Fei-Fei Li, convinced that machines lacked data more than cleverness, started ImageNet: over 14 million images labeled by tens of thousands of people. From 2010 a yearly contest asked programs to sort images into 1,000 categories.',
   'In 2012 AlexNet, by Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton, cut the top-5 error to 15.3%, against 26.2% for the runner-up. It is a deep convolutional network, trained on two graphics cards: small filters slide across the image and learn to detect edges, then shapes, then parts of objects. Yann LeCun had used convolutional networks since 1989 to read handwritten zip codes.',
   'Top-5 error: an image counts as wrong if the right category is not among the model\'s five guesses.'],
  people:[['Fei-Fei Li','feifei'],['Alex Krizhevsky','krizhevsky'],['Ilya Sutskever','sutskever']],
  ctrl:'<button class="h" data-act="human" aria-pressed="false">show the human estimate</button>',
  hint:'point at the bars to read the winners',
  line:'Graphics cards built for video games, over a million labeled photos and an old idea about sliding filters. Suddenly the woods came alive.'},
 15:{year:'2013',
  ps:['In 2013 Tomas Mikolov and colleagues at Google released word2vec, a fast way to turn each word into a list of a few hundred numbers: a vector. A small network learns the vectors from billions of words of text by predicting which words appear near each other.',
   'Words used in similar contexts end up close together, and some relations become directions. The best-known example: king − man + woman gives a vector whose nearest word, not counting the three words used, is queen.',
   'Language models still begin this way: in GPT, too, each token starts as a learned vector.'],
  people:[['Tomas Mikolov','mikolov']],
  ctrl:'<button class="h" data-act="an" data-v="0" aria-pressed="true">king − man + woman</button><button class="h" data-act="an" data-v="1" aria-pressed="false">uncle − man + woman</button><button class="h" data-act="an" data-v="2" aria-pressed="false">Paris − France + Italy</button><button class="h" data-act="an" data-v="3" aria-pressed="false">Berlin − Germany + Spain</button>',
  hint:'pick a sum and watch the arrows',
  note:'The map is a 2D sketch with invented positions; real word vectors have hundreds of dimensions. Without excluding the three words used, the nearest word is often one of them.',
  line:'Here words are places and meanings are directions. From man to woman is the same short walk as from king to queen.'},
 16:{year:'2016',
  ps:['In go, players place stones on a 19 × 19 grid to surround territory. There are about 2 × 10¹⁷⁰ legal positions: Deep Blue\'s brute force is hopeless here.',
   'DeepMind\'s AlphaGo combined neural networks, trained on human games and then by playing against itself, with Monte Carlo tree search. In March 2016, in Seoul, it beat Lee Sedol 4–1.',
   'Move 37 of the second game, which some commentators first took for a mistake, turned out to be decisive; in the fourth game Lee\'s move 78 earned him his only win.'],
  people:[['Lee Sedol','lee'],['Demis Hassabis','hassabis'],['David Silver','silver']],
  ctrl:'<button class="h" data-act="clear">clear the board</button>',
  hint:'click the intersections: surrounded stones are captured',
  line:'AlphaGo learned partly the way I did, by trying again and again. I needed two runs; it played millions of games against itself.'},
 17:{year:'2017',
  ps:['Eight researchers, then all at Google, published “Attention Is All You Need” and introduced the transformer, an architecture for sequences built on the attention mechanism.',
   'Each token looks at the others and weighs how relevant each one is to its meaning. So “it” links to “cat” if it was too tired, but to “street” if it was too wide. In models that generate text, like GPT, each token may look only at the tokens before it.',
   'Unlike recurrent networks, a transformer processes all the tokens of a text in parallel during training, which lets it learn from enormous amounts of text. It is the T in GPT.'],
  people:[['Ashish Vaswani and seven coauthors','vaswani']],
  ctrl:'<button class="h" data-act="end" data-v="0" aria-pressed="true">… it was too tired</button><button class="h" data-act="end" data-v="1" aria-pressed="false">… it was too wide</button>',
  hint:'tap a word in the left column',
  note:'Weights chosen by hand for illustration. Here every word can look at the whole sentence, as in the transformer\'s encoder.',
  line:'A bridge where every word is tied to every other word by a cable. The thicker the cable, the more attention it gets.'},
 18:{year:'2020',
  ps:['A protein is a chain of amino acids that folds into a precise 3D shape, and in most cases the shape determines what it does. Predicting it from the sequence alone had been an open problem for about fifty years.',
   'In 2020, at the CASP14 competition, DeepMind\'s AlphaFold 2 reached accuracy comparable to experiments for about two thirds of the proteins. A public database now holds predicted structures for over 200 million proteins.',
   'In 2024 the Nobel Prize in Chemistry went half to Demis Hassabis and John Jumper, for structure prediction, and half to David Baker, for designing new proteins.'],
  people:[['John Jumper','jumper'],['Demis Hassabis','hassabis'],['David Baker','baker']],
  ctrl:'<label class="rng">folding <input type="range" min="0" max="100" value="0" data-act="f"></label><button class="h" data-act="play">fold</button>',
  hint:'drag the slider or press “fold”',
  note:'A simplified 2D sketch, not a real protein structure.',
  line:'AlphaFold does not show how the chain folds, only the shape it ends up in. For biologists, that is already a great deal.'}});

const CONTENT_IT={
 intro:{year:`Dal 1843 a oggi`,h1:`Una mappa dell'intelligenza artificiale`,sub:`Quasi due secoli di macchine pensanti, disegnati a matita.`,
  ps:[`Ogni luogo di questa mappa è un momento della storia dell'IA. Il terreno sale nelle estati dell'entusiasmo e sprofonda in valli innevate nei due inverni dell'IA, all'incirca 1974–1980 e 1987–1993. La forma del paesaggio è qualitativa: racconta una storia, non misura nulla.`,
   `Percorri il sentiero con la rotella del mouse, i tasti freccia, uno scorrimento del dito o i pulsanti qui sotto. Ogni tappa ha un piccolo esperimento con cui giocare. “Mappa intera” mostra tutto in una volta.`,
   `La tua guida è Teseo, il topo meccanico costruito da Claude Shannon nel 1950. Le persone compaiono come schizzi stilizzati accompagnati dal nome, non come ritratti. Il tempo non è in scala: il lungo tratto prima del 1940 è compresso.`],
  ctrl:`<button class="h" data-nav="next">inizia la passeggiata</button>`,
  line:`Ciao! Sono Teseo, il topo che risolve labirinti costruito da Claude Shannon nel 1950. Scorri, trascina o usa i tasti freccia e ti accompagno lungo il sentiero.`},
 1:{year:`1843`,
  ps:[`Dal 1834 Charles Babbage progettò la macchina analitica: un “magazzino” per conservare i numeri, un “mulino” per eseguire i calcoli e istruzioni su schede perforate, prese in prestito dal telaio Jacquard. Non fu mai costruita.`,
   `Nel 1843 Ada Lovelace tradusse un articolo sulla macchina scritto da Luigi Federico Menabrea, un ingegnere militare che aveva ascoltato Babbage a Torino nel 1840. Le sue note erano lunghe circa tre volte l'articolo. La nota G descrive, passo per passo, come la macchina avrebbe potuto calcolare i numeri di Bernoulli: di solito è considerata il primo programma per computer pubblicato.`,
   `Scrisse anche che la macchina “non ha la minima pretesa di originare alcunché”: può fare soltanto ciò che sappiamo ordinarle di fare.`],
  ctrl:`<button class="h" data-act="crank">gira la manovella</button><button class="h" data-act="reset">cancella i risultati</button>`,
  hint:`ogni giro calcola il numero di Bernoulli successivo`,
  note:`Numerazione moderna: il numero che Lovelace chiamava B₇ è l'attuale B₈ = −1/30. La macchina è uno schizzo semplificato e le cifre nel magazzino sono decorative.`,
  line:`Un secolo prima di me, Lovelace capì che la macchina poteva lavorare su simboli, non solo su numeri. Nella nota A immaginò perfino che potesse comporre musica.`},
 2:{year:`1936`,
  ps:[`Nel 1936 il giovane Alan Turing affrontò un problema posto da David Hilbert: esiste un metodo meccanico che decida, per qualunque enunciato della logica, se è dimostrabile? Prima dovette definire con esattezza che cosa significa “calcolare”.`,
   `La sua risposta fu una macchina immaginaria: un nastro di celle, una testina che legge e scrive un simbolo alla volta e una tabella di regole della forma “in questo stato, se leggi questo simbolo, scrivi, spostati e cambia stato”. Eppure, secondo la tesi di Church–Turing, una macchina così può eseguire qualunque algoritmo.`,
   `La macchina sul foglio aggiunge 1 a un numero binario. La risposta alla domanda di Hilbert, trovata da Turing e pochi mesi prima da Alonzo Church, è no.`],
  ctrl:`<button class="h" data-act="step">un passo</button><button class="h" data-act="run">esegui fino alla fine</button><button class="h" data-act="again">aggiungi ancora 1</button><button class="h" data-act="reset">azzera il nastro</button>`,
  hint:`segui la testina e la regola evidenziata`,
  line:`Un nastro, una testina e una tabella di regole. In linea di principio, una macchina così può imitare qualunque computer, compresi i relè che mi guidavano nel labirinto.`},
 3:{year:`1943`,
  ps:[`Il neurofisiologo Warren McCulloch e il giovane logico Walter Pitts proposero un modello matematico del neurone: riceve segnali che valgono 0 o 1, li somma e “scatta” solo se la somma raggiunge una soglia θ.`,
   `Cambiando la soglia, lo stesso neurone calcola funzioni logiche diverse; collegando più neuroni, il loro modello può realizzare qualunque funzione logica. Il cervello, visto come una rete di interruttori.`,
   `Il modello originale ha anche ingressi inibitori, qui omessi. Questo neurone non impara: pesi e soglia sono fissati a mano. L'apprendimento sarebbe arrivato con il percettrone.`],
  ctrl:`<button class="h" data-act="th" data-v="-1">soglia −1</button><button class="h" data-act="th" data-v="1">soglia +1</button>`,
  hint:`tocca x₁ e x₂ sul foglio per accenderli e spegnerli`,
  line:`Un neurone che è solo un interruttore con una soglia. Buffo: anche il mio cervello era fatto di interruttori, relè telefonici nascosti sotto il labirinto.`},
 4:{year:`1950`,
  ps:[`In “Computing Machinery and Intelligence” Turing sostituì la domanda “Le macchine possono pensare?”, che giudicava troppo priva di senso per meritare una discussione, con un gioco: un interrogante scambia messaggi scritti con due giocatori nascosti, una persona e una macchina, e deve capire chi è chi.`,
   `Turing prevedeva che entro una cinquantina d'anni un interrogante medio non avrebbe avuto più del 70 per cento di probabilità di fare l'identificazione giusta dopo cinque minuti di domande.`,
   `Le risposte della macchina sul foglio vengono dal dialogo d'esempio che Turing scrisse nel suo articolo; quelle della persona sono inventate.`],
  ctrl:`<button class="h" data-act="guess" data-v="0">la macchina è A</button><button class="h" data-act="guess" data-v="1">la macchina è B</button><button class="h" data-act="next">domanda successiva</button>`,
  hint:`leggi le risposte e prova a indovinare`,
  note:`Il dialogo è tradotto dall'inglese. La domanda sugli scacchi è scritta in notazione algebrica moderna; Turing usava la vecchia notazione descrittiva.`,
  line:`Turing lo chiamava gioco dell'imitazione. Oggi tutti lo chiamano test di Turing, un nome che lui non usò mai.`},
 5:{year:`1950`,
  ps:[`Claude Shannon, che nel 1948 aveva fondato la teoria dell'informazione, costruì Teseo: un topo mosso da un magnete sotto un labirinto di 25 caselle. La sua “mente” era un banco di relè telefonici nascosto sotto il tavolo.`,
   `Nella prima corsa Teseo esplora per tentativi ed errori e, per ogni casella, i relè ricordano l'ultima direzione in cui ne è uscito. Nella seconda corsa il topo segue la memoria dritto fino alla meta.`,
   `Se si sposta la meta, la memoria diventa sbagliata: Teseo deve imparare di nuovo.`],
  ctrl:`<button class="h" data-act="explore">prima corsa: esplora</button><button class="h" data-act="recall">seconda corsa: ricorda</button><button class="h" data-act="move">sposta la meta</button>`,
  hint:`le frecce blu sono la memoria dei relè`,
  note:`La strategia di esplorazione sul foglio è semplificata.`,
  line:`Sono io! Shannon mi costruì nel 1950. Tutta la mia memoria sta in 25 frecce, una per casella, e ricordo sempre e soltanto l'ultima via d'uscita.`},
 6:{year:`1956`,
  ps:[`Nel 1955 John McCarthy, Marvin Minsky, Nathaniel Rochester e Claude Shannon proposero un progetto di ricerca estivo al Dartmouth College di Hanover, nel New Hampshire. La loro proposta contiene il primo uso noto dell'espressione “intelligenza artificiale”.`,
   `Nell'estate del 1956 parteciparono una ventina di ricercatori, in momenti diversi. Allen Newell e Herbert Simon portarono il Logic Theorist, scritto con Cliff Shaw: un programma che dimostra teoremi di logica.`,
   `Lavorava a ritroso partendo dal teorema, cercando un assioma o un teorema già dimostrato da trasformare nella tesi. Dimostrò 38 dei primi 52 teoremi del capitolo 2 dei <cite>Principia Mathematica</cite> e per uno di essi, il teorema 2.85, trovò una dimostrazione più breve.`],
  ctrl:`<button class="h" data-act="next">passo successivo</button><button class="h" data-act="thm" data-v="2.01" aria-pressed="true">teorema ✱2.01</button><button class="h" data-act="thm" data-v="2.02" aria-pressed="false">teorema ✱2.02</button>`,
  hint:`tre passi, da un assioma al teorema`,
  note:`Entrambe le dimostrazioni sono quelle dei <cite>Principia</cite>, in simboli moderni. Mostrano il tipo di catena che il Logic Theorist cercava.`,
  line:`Shannon, il mio costruttore, firmò la proposta di Dartmouth. Il nome “intelligenza artificiale” si attribuisce a McCarthy.`},
 7:{year:`1958`,
  ps:[`Nel 1958 lo psicologo Frank Rosenblatt presentò il percettrone, simulato prima su un computer IBM 704 e poi costruito come macchina, il Mark I: 400 fotocellule in una griglia 20 × 20, con pesi regolati da motori elettrici.`,
   `La novità è che impara dagli esempi: quando sbaglia, sposta di poco i pesi nella direzione giusta. Se i dati si possono separare con una retta (un iperpiano, in più dimensioni), è dimostrato che l'algoritmo ne trova una in un numero finito di passi.`,
   `Il New York Times riferì che la Marina degli Stati Uniti si aspettava una macchina capace di camminare, parlare, vedere e perfino essere consapevole della propria esistenza.`],
  ctrl:`<button class="h" data-act="step">un passo</button><button class="h" data-act="train">addestra</button><button class="h" data-act="cls" aria-pressed="false">aggiungi: ○</button><button class="h" data-act="new">nuovi dati</button>`,
  hint:`fai clic sul foglio per aggiungere punti`,
  line:`Io ho imparato il labirinto ricordando. Il percettrone impara correggendo i propri errori, un esempio alla volta.`},
 8:{year:`1966`,
  ps:[`Al MIT Joseph Weizenbaum scrisse ELIZA, descritto in un articolo pubblicato nel 1966. Il suo copione più noto, DOCTOR, imita uno psicoterapeuta che trasforma in domande le frasi del paziente.`,
   `ELIZA non capisce nulla: cerca parole chiave e applica regole di trasformazione. Eppure molti utenti si confidavano con il programma; la segretaria di Weizenbaum una volta gli chiese di uscire dalla stanza per poterci “parlare” in privato.`,
   `La tendenza ad attribuire comprensione a una macchina quando produce frasi plausibili oggi si chiama effetto ELIZA.`],
  ctrl:`<form class="chat"><input type="text" aria-label="Scrivi a ELIZA" placeholder="scrivi qui e premi Invio" autocomplete="off"><button class="h" type="submit">invia</button></form>`,
  hint:`prova: “mi sento stanco”, “mia madre…”, “sono sempre in ritardo”`,
  note:`Il copione DOCTOR originale era in inglese: la frase d'apertura ne è una traduzione, le altre regole sono state scritte in italiano per questa pagina, nel suo stile.`,
  line:`ELIZA non capì mai una parola, eppure la gente le confidava i propri segreti. Ricordatelo quando arriveremo alla città.`},
 9:{year:`1969–1973`,
  ps:[`Nel 1969 Marvin Minsky e Seymour Papert pubblicarono <cite>Perceptrons</cite>, uno studio matematico di ciò che i percettroni a uno strato non sanno fare. Il libro tratta soprattutto proprietà come la parità e la connessione; il suo esempio più semplice e più citato è lo XOR, l'“o esclusivo”, che vale 1 quando i due ingressi sono diversi.`,
   `Un percettrone a uno strato separa i dati con una sola retta, e nessuna retta separa i punti dello XOR. Le reti con più strati ci riescono, ma un modo pratico e ampiamente conosciuto per addestrarle arrivò solo negli anni Ottanta.`,
   `Il libro e il rapporto Lighthill (1973), commissionato dallo Science Research Council britannico, contribuirono ai tagli dei finanziamenti. Seguì il primo inverno dell'IA, all'incirca dal 1974 al 1980.`],
  ctrl:`<button class="h" data-act="fn" data-v="and" aria-pressed="false">AND</button><button class="h" data-act="fn" data-v="or" aria-pressed="false">OR</button><button class="h" data-act="fn" data-v="xor" aria-pressed="true">XOR</button>`,
  hint:`trascina i due punti rossi: riesci a separare lo XOR?`,
  line:`Brr, in fondo a questa discesa ci aspetta l'inverno. Quattro punti, una retta, e proprio non funziona: l'esempio classico di ciò che un percettrone a uno strato non sa fare.`},
 10:{year:`anni ’70`,
  ps:[`Negli anni Settanta l'IA cambiò strategia: invece di inseguire un'intelligenza generale, raccolse la conoscenza degli esperti in forma di regole “se… allora”. MYCIN, sviluppato a Stanford come lavoro di dottorato di Edward Shortliffe, identificava i batteri nelle infezioni gravi e suggeriva gli antibiotici, usando circa 600 regole.`,
   `MYCIN ragionava all'indietro: partiva da un'ipotesi e poneva solo le domande necessarie per verificarla. Se gli si chiedeva “perché?”, sapeva dire quale regola stava provando.`,
   `In una valutazione del 1979 i suoi consigli furono giudicati accettabili almeno altrettanto spesso di quelli degli specialisti di Stanford, eppure non fu mai usato nella pratica clinica. Negli anni Ottanta i sistemi esperti basati su regole diventarono un'industria.`],
  ctrl:`<button class="h" data-act="yes">sì</button><button class="h" data-act="no">no</button><button class="h" data-act="restart">ricomincia</button>`,
  hint:`pensa a un animale e rispondi: il sistema chiede solo ciò che gli serve`,
  note:`Le regole sugli animali sono adattate da un classico esempio da manuale; non sono le regole mediche di MYCIN.`,
  line:`Bloccati dalla neve, i costruttori di regole continuarono a lavorare. Nota che il sistema chiede solo ciò che gli serve e sa sempre dirti perché lo sta chiedendo.`},
 11:{year:`1982`,
  ps:[`Nel 1982 il fisico John Hopfield mostrò come una rete di neuroni possa funzionare da memoria. Ogni neurone è collegato a tutti gli altri e le configurazioni memorizzate sono scritte nei pesi delle connessioni.`,
   `Si fa partire la rete da una configurazione danneggiata e si lasciano aggiornare i neuroni uno alla volta: una grandezza chiamata energia non aumenta mai, e di solito la rete si assesta sul ricordo memorizzato più vicino al punto di partenza. La matematica è strettamente legata ai modelli di materiali magnetici chiamati vetri di spin.`,
   `Troppi ricordi la confondono: una rete di N neuroni memorizza in modo affidabile solo circa 0,14 N configurazioni. Nel 2024 Hopfield ha condiviso il premio Nobel per la fisica con Geoffrey Hinton.`],
  ctrl:`<button class="h" data-act="recall">richiama</button><button class="h" data-act="noise">aggiungi rumore</button><button class="h" data-act="pat" data-v="0">T</button><button class="h" data-act="pat" data-v="1">L</button><button class="h" data-act="pat" data-v="2">X</button>`,
  hint:`fai clic sulle celle per danneggiare la figura, poi premi “richiama”`,
  note:`La griglia ha 100 neuroni e memorizza 3 configurazioni.`,
  line:`Una memoria che si ripara da sola: le mostri un'immagine danneggiata e ritrova il resto. I miei relè non ci sarebbero mai riusciti.`},
 12:{year:`1986`,
  ps:[`Per addestrare una rete con più strati bisogna sapere quanto ciascun peso, compresi quelli nascosti, ha contribuito all'errore finale. La retropropagazione lo calcola con la regola della catena: l'errore viaggia all'indietro, strato dopo strato.`,
   `L'idea ha radici negli anni Sessanta e Settanta (Kelley, Bryson, Linnainmaa, Werbos), ma diventò famosa nel 1986 con un articolo su <cite>Nature</cite> di Rumelhart, Hinton e Williams, le cui reti imparavano rappresentazioni interne. La rete sul foglio, con tre neuroni nascosti, impara lo XOR.`,
   `Un anno dopo crollò il mercato delle macchine Lisp, computer costruiti per eseguire il Lisp, il principale linguaggio dell'IA; i sistemi esperti si rivelarono costosi da mantenere. I finanziamenti si esaurirono di nuovo: fu il secondo inverno dell'IA, all'incirca 1987–1993.`],
  ctrl:`<button class="h" data-act="train">addestra</button><button class="h" data-act="reset">nuovi pesi casuali</button>`,
  hint:`blu in avanti, rosso all'indietro; linea più spessa = peso più grande, tratteggiata = negativo`,
  line:`Di nuovo il passo XOR, e questa volta tre neuroni nascosti lo superano. Goditi il panorama: subito dopo questo crinale il sentiero scende nel secondo inverno.`},
 13:{year:`1997`,
  ps:[`Nel febbraio 1996, a Filadelfia, il campione del mondo Garry Kasparov batté Deep Blue di IBM per 4–2. Nella rivincita del maggio 1997, a New York, vinse la macchina per 3½–2½: Kasparov si aggiudicò la prima partita, Deep Blue la seconda e la decisiva sesta, e le altre tre finirono patte.`,
   `Deep Blue non imitava il pensiero di un grande maestro. Con chip costruiti appositamente valutava circa 200 milioni di posizioni al secondo, esplorava l'albero delle mosse possibili e scartava i rami inutili con la potatura alfa-beta.`,
   `Fu un trionfo della ricerca a forza bruta, guidata da una funzione di valutazione scritta da persone.`],
  ctrl:`<label class="rng">profondità <input type="range" min="1" max="12" value="4" data-act="depth"></label>`,
  hint:`quante posizioni, se guardi avanti di d semimosse?`,
  line:`Deep Blue non imparò mai dalle sue partite: cercava, velocissimo. Il mio labirinto aveva 25 caselle; gli scacchi hanno molte più posizioni di quante chiunque potrebbe mai contarne.`},
 14:{year:`2012`,
  ps:[`Fei-Fei Li, convinta che alle macchine mancassero i dati più che l'ingegno, avviò ImageNet: oltre 14 milioni di immagini etichettate da decine di migliaia di persone. Dal 2010 una gara annuale chiedeva ai programmi di classificare le immagini in 1000 categorie.`,
   `Nel 2012 AlexNet, di Alex Krizhevsky, Ilya Sutskever e Geoffrey Hinton, abbassò l'errore top-5 al 15,3%, contro il 26,2% del secondo classificato. È una rete convoluzionale profonda, addestrata su due schede grafiche: piccoli filtri scorrono sull'immagine e imparano a riconoscere bordi, poi forme, poi parti di oggetti. Yann LeCun usava reti convoluzionali dal 1989 per leggere i codici postali scritti a mano.`,
   `Errore top-5: un'immagine conta come sbagliata se la categoria giusta non è tra le cinque proposte del modello.`],
  ctrl:`<button class="h" data-act="human" aria-pressed="false">mostra la stima umana</button>`,
  hint:`punta le barre per leggere i vincitori`,
  line:`Schede grafiche nate per i videogiochi, oltre un milione di foto etichettate e una vecchia idea sui filtri che scorrono. All'improvviso il bosco prese vita.`},
 15:{year:`2013`,
  ps:[`Nel 2013 Tomas Mikolov e i suoi colleghi di Google pubblicarono word2vec, un metodo veloce per trasformare ogni parola in una lista di qualche centinaio di numeri: un vettore. Una piccola rete impara i vettori da miliardi di parole di testo, prevedendo quali parole compaiono vicine.`,
   `Le parole usate in contesti simili finiscono vicine, e alcune relazioni diventano direzioni. L'esempio più noto: re − uomo + donna dà un vettore la cui parola più vicina, escluse le tre usate, è regina.`,
   `I modelli linguistici cominciano ancora così: anche in GPT ogni token parte come un vettore appreso.`],
  ctrl:`<button class="h" data-act="an" data-v="0" aria-pressed="true">re − uomo + donna</button><button class="h" data-act="an" data-v="1" aria-pressed="false">zio − uomo + donna</button><button class="h" data-act="an" data-v="2" aria-pressed="false">Parigi − Francia + Italia</button><button class="h" data-act="an" data-v="3" aria-pressed="false">Berlino − Germania + Spagna</button>`,
  hint:`scegli una somma e guarda le frecce`,
  note:`La mappa è uno schizzo in 2D con posizioni inventate; i veri vettori di parole hanno centinaia di dimensioni. Senza escludere le tre parole usate, la più vicina è spesso una di loro. Gli esempi originali erano in inglese (king, man, woman, queen).`,
  line:`Qui le parole sono luoghi e i significati sono direzioni. Da uomo a donna c'è la stessa breve passeggiata che da re a regina.`},
 16:{year:`2016`,
  ps:[`Nel go i giocatori posano pietre su una griglia 19 × 19 per circondare territorio. Le posizioni legali sono circa 2 × 10¹⁷⁰: qui la forza bruta di Deep Blue non ha speranze.`,
   `AlphaGo di DeepMind combinava reti neurali, addestrate su partite umane e poi giocando contro sé stesse, con la ricerca ad albero Monte Carlo. Nel marzo 2016, a Seul, batté Lee Sedol per 4–1.`,
   `La mossa 37 della seconda partita, che alcuni commentatori presero dapprima per un errore, si rivelò decisiva; nella quarta partita la mossa 78 di Lee gli valse la sua unica vittoria.`],
  ctrl:`<button class="h" data-act="clear">svuota il goban</button>`,
  hint:`fai clic sulle intersezioni: le pietre circondate vengono catturate`,
  line:`AlphaGo imparò in parte come me, provando e riprovando. A me bastarono due corse; lui giocò milioni di partite contro sé stesso.`},
 17:{year:`2017`,
  ps:[`Otto ricercatori, allora tutti a Google, pubblicarono “Attention Is All You Need” e introdussero il transformer, un'architettura per sequenze basata sul meccanismo dell'attenzione.`,
   `Ogni token guarda gli altri e pesa quanto ciascuno è rilevante per il proprio significato. Così “era” si lega a “gatto” se era troppo stanco, ma a “strada” se era troppo larga. Nei modelli che generano testo, come GPT, ogni token può guardare solo i token che lo precedono.`,
   `A differenza delle reti ricorrenti, durante l'addestramento un transformer elabora in parallelo tutti i token di un testo, e questo gli permette di imparare da enormi quantità di testo. È la T di GPT.`],
  people:[['Ashish Vaswani e sette coautori','vaswani']],
  ctrl:`<button class="h" data-act="end" data-v="0" aria-pressed="true">… era troppo stanco</button><button class="h" data-act="end" data-v="1" aria-pressed="false">… era troppo larga</button>`,
  hint:`tocca una parola nella colonna di sinistra`,
  note:`Pesi scelti a mano a scopo illustrativo. Qui ogni parola può guardare l'intera frase, come nell'encoder del transformer. L'esempio inglese usa il pronome “it”; in italiano il soggetto è sottinteso in “era”, e la desinenza dell'aggettivo (stanco, larga) basta già a sciogliere l'ambiguità.`,
  line:`Un ponte dove ogni parola è legata a ogni altra da un cavo. Più il cavo è spesso, più attenzione riceve.`},
 18:{year:`2020`,
  ps:[`Una proteina è una catena di amminoacidi che si ripiega in una forma tridimensionale precisa, e nella maggior parte dei casi è la forma a determinarne la funzione. Prevederla a partire dalla sola sequenza era un problema aperto da una cinquantina d'anni.`,
   `Nel 2020, alla competizione CASP14, AlphaFold 2 di DeepMind raggiunse un'accuratezza paragonabile a quella sperimentale per circa due terzi delle proteine. Oggi un database pubblico contiene le strutture previste di oltre 200 milioni di proteine.`,
   `Nel 2024 il premio Nobel per la chimica è andato per metà a Demis Hassabis e John Jumper, per la previsione delle strutture, e per metà a David Baker, per la progettazione di nuove proteine.`],
  ctrl:`<label class="rng">ripiegamento <input type="range" min="0" max="100" value="0" data-act="f"></label><button class="h" data-act="play">ripiega</button>`,
  hint:`trascina il cursore o premi “ripiega”`,
  note:`Uno schizzo semplificato in 2D, non una vera struttura proteica.`,
  line:`AlphaFold non mostra come la catena si ripiega, solo la forma in cui finisce. Per i biologi è già moltissimo.`},
 19:{year:`2018–2022`,
  ps:[`OpenAI addestrò transformer sempre più grandi su un compito semplice: prevedere il token successivo in enormi raccolte di testo. GPT-1 (2018) aveva 117 milioni di parametri, GPT-2 (2019) 1,5 miliardi, GPT-3 (2020) 175 miliardi.`,
   `ChatGPT fu rilasciato il 30 novembre 2022. Era stato ulteriormente addestrato con il feedback umano (RLHF) per seguire istruzioni e sostenere una conversazione. Secondo le stime dell'epoca, raggiunse 100 milioni di utenti in circa due mesi.`,
   `Un modello così sceglie un token alla volta da una distribuzione di probabilità. La temperatura stabilisce quanto la scelta sia audace.`],
  ctrl:`<button class="h" data-act="gen">scegli un token</button><button class="h" data-act="restart">ricomincia</button><button class="h" data-act="mode" aria-pressed="false">mostra le dimensioni dei modelli</button><label class="rng">temperatura <input type="range" min="0.2" max="2" step="0.1" value="1" data-act="temp"></label>`,
  hint:`premi “scegli un token” per allungare la frase`,
  note:`La frase e le sue probabilità sono inventate a scopo didattico. Un modello reale assegna un punteggio a ogni token del suo vocabolario.`,
  line:`Un modello linguistico sceglie un token alla volta, come io sceglievo una casella alla volta. Il mio labirinto aveva 25 caselle; il vocabolario di GPT-3 ha circa 50.000 token.`},
 end:{year:`Oggi`,h2:`Il belvedere`,
  ps:[`Il sentiero finisce qui, per ora. Alle tue spalle ci sono le estati e gli inverni dell'IA; davanti a te, la storia si sta ancora scrivendo.`,`Apri la mappa intera per tornare a qualunque tappa.`],

const CT=()=>LANG==='it'?CONTENT_IT:CONTENT;

const cv=$('map'),ctx=cv.getContext('2d'),panel=$('panel'),bar=$('bar'),bub=$('bub'),marks=$('marks');

 for(let i=0;i<4200;i++){g.fillStyle=d?`rgba(255,255,255,${r()*0.05})`:`rgba(40,40,30,${r()*0.06})`;g.fillRect(r()*160,r()*160,1+r()*1.4,1+r()*1.4)}
 grainPat=ctx.createPattern(c,'repeat');document.body.style.setProperty('--grain',`url(${c.toDataURL()})`)}

const TPX=512,LV=[0.5,1,2],BASE=0.125,MAXT=/Mobi|Android/i.test(navigator.userAgent)?48:84;

function renderTile(L,ix,iy){const s=LV[L],ws=TPX/s;const t=document.createElement('canvas');t.width=t.height=TPX;const c=t.getContext('2d');paper(c,TPX,TPX);
 c.setTransform(s,0,0,s,-ix*TPX,-iy*TPX);c.beginPath();c.rect(ix*ws,iy*ws,ws,ws);c.clip();drawItems(c,s,ix*ws-80,iy*ws-80,(ix+1)*ws+80,(iy+1)*ws+80);return t}
let wantQ=[];

 if(tiles.size>MAXT){const arr=[...tiles.entries()].sort((a,b)=>a[1].last-b[1].last);for(let i=0;i<tiles.size-MAXT&&i<arr.length;i++)if(arr[i][1].last<frameNo)tiles.delete(arr[i][0])}}

function area(){if(FILM)return filmArea();const mob=innerWidth<=760;const bh=bar.offsetHeight;if(mob){const ph=panel.offsetHeight;return{x:0,y:0,w:W,h:Math.max(120,H-bh-ph-10)}}

 if(innerWidth<=760)return fitRect(st.dir>0?st.px-450:st.px-350,st.py-700,800,790);return fitRect(st.dir>0?st.px-470:st.px-740,st.py-720,1210,920)}
const overview=()=>fitRect(-100,-60,WW+200,WH+120);
function toScreen(wx,wy){const a=area();return[a.x+a.w/2+(wx-cam.x)*cam.z,a.y+a.h/2+(wy-cam.y)*cam.z]}
function toWorld(sx,sy){const a=area();return[cam.x+(sx-a.x-a.w/2)/cam.z,cam.y+(sy-a.y-a.h/2)/cam.z]}
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

/* ================= disegno del fotogramma ================= */
const live={};

function renderLive(S,L){const kk=Math.min(3,Math.max(.5,dpr*cam.z));const bw=Math.round(640*kk),bh=Math.round(520*kk);if(L.cv.width!==bw||L.cv.height!==bh){L.cv.width=bw;L.cv.height=bh}
 const c=L.cv.getContext('2d');c.setTransform(kk,0,0,kk,0,0);c.fillStyle=C.sheet;c.fillRect(0,0,640,520);P.ctx=c;P.budget=Infinity;P.used=0;P.dry=false;P.minw=0;P.scale=0;SC[S.scene].draw(L.st);L.k=kk;L.dirty=false}
const SNOWR=[[11700,700,13600,3500],[0,2650,7400,4300],[0,3700,1900,5700]];let FLAKES=[];
function makeFlakes(){FLAKES=[];const r=mulberry(77);for(const R of SNOWR){const n=Math.floor((R[2]-R[0])*(R[3]-R[1])/14000);for(let i=0;i<n;i++)FLAKES.push({R,x:R[0]+r()*(R[2]-R[0]),y:r()*(R[3]-R[1]),sp:40+r()*50,ph:r()*6})}}
let curT=1830;
function draw(){if(FILM&&typeof FILMSKIP!=='undefined'&&FILMSKIP)return false;frameNo++;const a=area(),k=dpr*cam.z;const ox=dpr*(a.x+a.w/2)-k*cam.x,oy=dpr*(a.y+a.h/2)-k*cam.y;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.paper;ctx.fillRect(0,0,cv.width,cv.height);
 const wx0=-ox/k,wy0=-oy/k,wx1=(cv.width-ox)/k,wy1=(cv.height-oy)/k;
 // livello base, sempre pronto
 if(baseCv){const sx=Math.max(0,wx0*BASE),sy=Math.max(0,wy0*BASE),ex=Math.min(baseCv.width,wx1*BASE),ey=Math.min(baseCv.height,wy1*BASE);
  if(ex>sx&&ey>sy)ctx.drawImage(baseCv,sx,sy,ex-sx,ey-sy,ox+k*sx/BASE,oy+k*sy/BASE,k*(ex-sx)/BASE,k*(ey-sy)/BASE)}
 // tasselli
 let L=-1;if(k>BASE*1.3){L=LV.findIndex(s=>s>=k/1.3);if(L<0)L=LV.length-1}
 wantQ=[];const cxw=(wx0+wx1)/2,cyw=(wy0+wy1)/2;
 for(let l=0;l<=L;l++){const s=LV[l],ws=TPX/s;const i0=Math.max(0,Math.floor(wx0/ws)),i1=Math.min(Math.floor(WW/ws),Math.floor(wx1/ws)),j0=Math.max(0,Math.floor(wy0/ws)),j1=Math.min(Math.floor(WH/ws),Math.floor(wy1/ws));
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const key=l+':'+i+':'+j;const t=tiles.get(key);
   if(t){t.last=frameNo;const dx=Math.floor(ox+k*i*ws),dy=Math.floor(oy+k*j*ws),dx2=Math.ceil(ox+k*(i+1)*ws),dy2=Math.ceil(oy+k*(j+1)*ws);ctx.drawImage(t.cv,dx,dy,dx2-dx,dy2-dy)}
   else if(l===L)wantQ.push([key,l,i,j,Math.hypot((i+.5)*ws-cxw,(j+.5)*ws-cyw)])}}
 wantQ.sort((p,q)=>p[4]-q[4]);
 // fogli vivi
 for(const S of STOPS){const Lv=S.n&&live[S.n];if(!Lv)continue;if(S.ox+640<wx0||S.ox>wx1||S.oy+520<wy0||S.oy>wy1)continue;
  const still=!tr;if(Lv.dirty||(still&&STOPS[cur]===S&&Math.abs(Lv.k-Math.min(3,Math.max(.5,k)))/Lv.k>.15))renderLive(S,Lv);
  const dx=Math.round(ox+k*S.ox),dy=Math.round(oy+k*S.oy);ctx.drawImage(Lv.cv,dx,dy,Math.round(ox+k*(S.ox+640))-dx,Math.round(oy+k*(S.oy+520))-dy)}
 // animazioni ambientali, in coordinate di mondo
 ctx.setTransform(k,0,0,k,ox,oy);const T=reduce?0:time;let amb=false;ctx.save();ctx.beginPath();ctx.rect(wx0,wy0,wx1-wx0,wy1-wy0);for(const S of STOPS)if(S.n)ctx.rect(S.sx,S.sy,680,560);ctx.clip('evenodd');
 const vis=(x,y,m)=>x>wx0-m&&x<wx1+m&&y>wy0-m&&y<wy1+m;
 if(cam.z>.1){ctx.lineCap='round';
  for(const[cx,cy]of CHIM)if(vis(cx,cy-200,300)){amb=true;ctx.strokeStyle=C.muted;for(let p=0;p<5;p++){const u=((T*.2+p/5+cx*.001)%1);ctx.globalAlpha=.28*(1-u)*Math.min(1,u*6);ctx.lineWidth=1.5;ctx.beginPath();
   const q=hsh(p,cx)%100/100;ctx.ellipse(cx+u*(60+q*40)+Math.sin(T*1.1+p*2)*10,cy-u*240,10+u*(30+q*20),8+u*22,q*.8,0,Math.PI*2);ctx.stroke()}}

 try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(_){}
 applyStatic();bubble(false);for(const k in live)delete live[k];buildPanel();mmBuild();showPanel(cur);
 $('loading').classList.add('on');
 setTimeout(()=>{rebuild();$('loading').classList.remove('on');const S=STOPS[cur];if(S.done&&!ov){const L=ensureLive(S);L.dirty=true}onResize()},30)}
let lastT=0;
function tickAll(now,dt){time+=dt;
 if(tr){stepTr(now);needs=true;mmDraw()}
 const S=STOPS[cur];const L=S.done&&live[S.n];if(L&&L.st.anim&&SC[S.scene].tick){SC[S.scene].tick(L.st,dt);L.dirty=true;needs=true}
 if(bubOn&&now>bubUntil)bubble(false);
 if(needs||(!reduce&&ambOn)){needs=false;ambOn=draw();placeBubble();placeMarks()}}
function loop(now){const dt=Math.min(.05,(now-lastT)/1000||0);lastT=now;tickAll(now,dt);genTiles(tr?4:10);requestAnimationFrame(loop)}
let ambOn=false;
async function start(){if(FILM)filmSetup();applyStatic();readAll();makeGrain();sizeCanvas();buildPanel();mmBuild();
 const h=location.hash.slice(1);if(h.startsWith('stop-')){const n=+h.slice(5);const i=STOPS.findIndex(S=>S.n===n);if(i>=0)cur=i}else if(h==='end')cur=STOPS.length-1;
 try{await Promise.race([Promise.all(['400 30px Caveat','600 30px Caveat','400 18px Newsreader','500 30px Newsreader'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))])}catch(_){}
 rebuild();$('loading').classList.remove('on');
 showPanel(cur);cam=viewOf(cur);TS.s=STOPS[cur].ts;TS.dir=STOPS[cur].dir;curT=STOPS[cur].t;mmDraw();
 if(h==='map')setOverview(true);else arrive();
 ready=true;if(FILM){VCLOCK=0;filmReady()}else requestAnimationFrame(loop)}
start();

/* ================= modalità film: orologio virtuale e didascalie, per la cattura del video ================= */
function filmSetup(){const _r=mulberry(20260923);Math.random=_r;const p=FILM==='p';document.body.classList.add('film',p?'film-p':'film-l');
 const st=document.createElement('style');st.textContent=`
 body.film #panel,body.film #bub,body.film #marks,body.film #prev,body.film #next,body.film #ovbtn,body.film #fold,body.film #theme,body.film #mmnote{display:none!important}
 #fcap{position:fixed;left:0;right:0;z-index:8;background-color:var(--paper);background-image:var(--grain,none);display:flex;flex-direction:column;justify-content:center}
 #fcap .yy{font-family:var(--hand);font-weight:600;color:var(--red);line-height:1}
 #fcap .tt{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
 #fcap .nn{position:absolute;font-family:var(--hand);color:var(--muted)}
 body.film-l #fcap{top:auto;bottom:0;height:118px;right:auto;width:640px;padding:0 0 0 30px}
 body.film-l #fcap .yy{font-size:40px}body.film-l #fcap .tt{font-size:38px;margin-top:4px}body.film-l #fcap .nn{right:10px;top:16px;font-size:24px}
 body.film-l #bar{height:118px;padding:0 34px 0 660px;border-top:1.4px solid var(--line)}body.film-l #mm{height:78px}
 body.film-p #fcap{top:0;height:190px;padding:0 26px;border-bottom:1.4px solid var(--line)}
 body.film-p #fcap .yy{font-size:40px}body.film-p #fcap .tt{font-size:34px;margin-top:6px}body.film-p #fcap .nn{right:22px;top:22px;font-size:24px}
 body.film-p #bar{height:84px;padding:0 20px}body.film-p #mm{height:60px}`;document.head.appendChild(st);
 const c=document.createElement('div');c.id='fcap';c.innerHTML='<div class="yy"></div><div class="tt"></div><div class="nn"></div>';document.body.appendChild(c)}
function filmArea(){const p=FILM==='p';return p?{x:0,y:190,w:W,h:H-190-84}:{x:0,y:0,w:W,h:H-118}}
let FCAP=null;
function filmCaption(i){if(FCAP)return;const S=STOPS[i];const c=document.getElementById('fcap');if(!c)return;
 let yy,tt,nn='';if(S.n){yy=CT()[S.n].year;tt=ttl(S);nn=S.n+' / 19'}else if(S.k==='intro'){yy=LX('1843 to today','dal 1843 a oggi');tt=LX('A map of artificial intelligence',`Una mappa dell'intelligenza artificiale`)}else{yy=LX('today','oggi');tt=LX('The lookout','Il belvedere')}
 c.querySelector('.yy').textContent=yy;c.querySelector('.tt').textContent=tt;c.querySelector('.nn').textContent=nn}
function filmSetCaption(yy,tt,nn){FCAP=null;const c=document.getElementById('fcap');c.querySelector('.yy').textContent=yy;c.querySelector('.tt').textContent=tt;c.querySelector('.nn').textContent=nn||'';FCAP=1}
function filmReady(){mmDraw();needs=true;draw()}
let FILMSKIP=false;
window.filmStep=function(dt,skip){FILMSKIP=!!skip;VCLOCK+=dt*1000;needs=true;tickAll(VCLOCK,dt);if(!skip){let n=0;while(wantQ.length&&n<60){genTiles(1e9);needs=true;draw();n++}}FILMSKIP=false;return !!tr};
window.filmAct=function(i,a,v){const S=STOPS[i];const L=ensureLive(S);const sc=SC[S.scene];const el=L.st.el&&L.st.el.querySelector(`[data-act="${a}"]`);
 if(a==='say')sc.say(L.st,v);else sc.act&&sc.act(L.st,a,v,el);L.dirty=true;needs=true};
window.filmSet=function(i,fn){const S=STOPS[i];const L=ensureLive(S);fn(L.st);L.dirty=true;needs=true};
window.filmOverview=function(){ov=true;showPanel(cur);cam=overview();tr=null;needs=true;mmDraw()};
